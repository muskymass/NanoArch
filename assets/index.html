<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoArch</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c1f24;--mute:#5d6572;--line:#dfe2e7;--accent:#1f5fae;--accent-ink:#fff;--warn:#a65b00;--bad:#b3261e;--ok:#1b7a43;--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171b;--panel:#1d2127;--ink:#e8eaee;--mute:#9aa3b0;--line:#2e343c;--accent:#5b9cf0;--accent-ink:#0b1320;--warn:#e0a24a;--bad:#f2837c;--ok:#5fcf8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:700}
header .sub{color:var(--mute);font-size:12px}
header .grow{flex:1}
main{flex:1;display:grid;grid-template-columns:400px 1fr 420px;gap:12px;padding:12px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.scroll{overflow:auto;padding:12px;flex:1}
h2{font-size:13px;margin:14px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input[type=checkbox]{width:auto}
textarea{min-height:110px;font-family:Consolas,monospace;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--mute);margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td input,td select{padding:3px 5px;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.alts{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);min-height:112px}
.alt{flex:0 0 auto;width:130px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:2px;position:relative}
.alt.sel{border-color:var(--accent)}
.alt svg{width:100%;height:auto;display:block;max-height:118px}
.alt .tag{position:absolute;top:2px;inset-inline-start:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 4px}
#v3{flex:1;display:none;flex-direction:column;min-height:0;background:#f3f5f8}
#v3 .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid #ddd}
#v3 .tools label{display:flex;gap:4px;align-items:center;margin:0}
#gl{flex:1;width:100%;min-height:0;display:block;cursor:grab;touch-action:none}
#viewer{flex:1;overflow:auto;padding:8px;background:#fff;display:flex;justify-content:center;align-items:flex-start}
#viewer svg{width:100%;max-width:820px;height:auto;flex:0 0 auto}
#viewer svg .wall.int,#viewer svg .door,#viewer svg .window,#viewer svg .room{cursor:pointer}
#viewer svg .sel{stroke:#e6a100!important;stroke-width:4!important}
#viewer svg g.sel .leaf,#viewer svg g.sel .glass{stroke:#e6a100!important;stroke-width:3!important}
#inspector input{width:90px}
#inspector .hint{color:var(--mute);font-size:12px}
.rooms{table-layout:fixed}
.rooms th,.rooms td{padding:3px 2px}
.rooms th:nth-child(1){width:27%}.rooms th:nth-child(2){width:19%}.rooms th:nth-child(3){width:15%}.rooms th:nth-child(4){width:19%}.rooms th:nth-child(5){width:8%}.rooms th:nth-child(6){width:12%}
.rooms select{padding:3px 1px;font-size:11px}
.rooms input[type=number]{width:100%!important}
.rooms button{padding:2px 6px}
.empty{color:var(--mute);padding:32px;text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:9px 6px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none}.pane.on{display:block}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
ul.clean{margin:0;padding-inline-start:18px}
ul.clean li{margin:3px 0}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)}
.missing{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:8px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--mute)}
#busy{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;z-index:9}
#busy.on{display:flex}
#toast{position:fixed;bottom:16px;inset-inline-start:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:10;max-width:60vw}
#toast.on{opacity:1}
@media (max-width:1200px){main{grid-template-columns:340px 1fr 340px}}
</style>
</head>
<body>
<header>
  <h1>NanoArch</h1><span class="sub" data-i="subtitle"></span>
  <span class="grow"></span>
  <span class="badge" data-i="prelim"></span>
  <button id="lang">English</button>
</header>
<main>
  <!-- ============ brief ============ -->
  <section class="col">
    <div class="scroll">
      <h2 data-i="h_project"></h2>
      <label data-i="title"></label><input id="title">
      <div class="row"><div><label data-i="width"></label><input id="width" type="number" step="0.1" min="0"></div>
      <div><label data-i="length"></label><input id="length" type="number" step="0.1" min="0"></div></div>
      <div class="row3"><div><label data-i="sb_front"></label><input id="sbf" type="number" step="0.1" min="0" value="0"></div>
      <div><label data-i="sb_back"></label><input id="sbb" type="number" step="0.1" min="0" value="0"></div>
      <div><label data-i="sb_side"></label><input id="sbs" type="number" step="0.1" min="0" value="0"></div></div>
      <div class="note" data-i="sb_note"></div>
      <label data-i="entry"></label>
      <select id="entry"><option value="south" data-i="south"></option><option value="north" data-i="north"></option><option value="east" data-i="east"></option><option value="west" data-i="west"></option></select>

      <h2 data-i="h_rooms"></h2>
      <table class="rooms"><thead><tr><th data-i="r_name"></th><th data-i="r_func"></th><th data-i="r_area"></th><th data-i="r_zone"></th><th data-i="r_floor"></th><th>☀</th><th></th></tr></thead><tbody id="rooms"></tbody></table>
      <div class="bar" style="padding:8px 0;border:0"><button id="addroom" data-i="add_room"></button><button id="example" data-i="example"></button><button id="example2" data-i="example2"></button></div>

      <h2 data-i="h_struct"></h2>
      <div class="note" data-i="struct_note"></div>
      <div class="row"><div><label data-i="dead"></label><input id="dead" type="number" step="0.1" min="0"></div>
      <div><label data-i="live"></label><input id="live" type="number" step="0.1" min="0"></div></div>
      <div class="row"><div><label data-i="bearing"></label><input id="bearing" type="number" step="1" min="0"></div>
      <div><label data-i="floors"></label><input id="floors" type="number" step="1" min="1" value="1"></div></div>
      <div class="note" data-i="stair_note"></div>
      <div class="row"><div><label data-i="stair_w"></label><input id="stairw" type="number" step="0.1" min="0"></div>
      <div><label data-i="stair_l"></label><input id="stairl" type="number" step="0.1" min="0"></div></div>
      <label data-i="stair_side"></label><select id="stairside"><option value="west" data-i="west"></option><option value="east" data-i="east"></option></select>
      <label data-i="maxspan"></label><input id="maxspan" type="number" step="100" min="0">
    </div>
    <div class="bar"><button id="generate" class="primary" style="flex:1" data-i="generate"></button></div>
  </section>

  <!-- ============ plan ============ -->
  <section class="col">
    <div class="bar">
      <button id="openproj" data-i="open_proj"></button>
      <button id="undo" disabled data-i="undo"></button><button id="redo" disabled data-i="redo"></button>
      <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="showstruct"><span data-i="show_struct"></span></label>
      <button id="sync" disabled data-i="sync"></button>
      <button id="to3d" disabled></button>
      <span style="flex:1"></span>
      <span id="savestate" class="badge"></span>
      <button id="exportsvg" disabled data-i="export_svg"></button><button id="exportifc" disabled data-i="export_ifc"></button><button id="exportdxf" disabled data-i="export_dxf"></button><button id="exportdxfall" disabled style="display:none" data-i="export_dxf_all"></button><button id="exportpdf" disabled data-i="export_pdf"></button><button id="saveproj" disabled data-i="save_proj"></button>
    </div>
    <div class="alts" id="alts"><div class="empty" data-i="alts_empty"></div></div>
    <div id="levelbar" class="bar" style="display:none;gap:6px;padding:6px 8px"></div>
    <div id="inspector" class="bar" style="display:none"></div>
    <div id="viewer"><div class="empty" data-i="viewer_empty"></div></div>
    <div id="v3">
      <div class="tools">
        <label><input type="checkbox" id="v-slab"><span data-i="v_slab"></span></label>
        <label><input type="checkbox" id="v-struct"><span data-i="v_struct"></span></label>
        <label><input type="checkbox" id="v-floor"><span data-i="v_floor"></span></label>
        <label><input type="checkbox" id="v-glass"><span data-i="v_glass"></span></label>
        <label><input type="checkbox" id="v-mep"><span data-i="v_mep"></span></label>
        <label id="v-level-wrap" style="display:none"><span data-i="v_level"></span> <select id="v-level"></select></label>
        <button id="v-top" data-i="v_top"></button><button id="v-reset" data-i="v_reset"></button>
        <span id="v3-info" class="note"></span>
      </div>
      <canvas id="gl"></canvas>
      <div class="tools"><span class="note" data-i="v_hint"></span><span id="v3-pick" style="font-weight:600"></span></div>
    </div>
  </section>

  <!-- ============ results ============ -->
  <section class="col">
    <div class="tabs">
      <button class="tab on" data-tab="notes" data-i="t_notes"></button><button class="tab" data-tab="qto" data-i="t_qto"></button>
      <button class="tab" data-tab="sched" data-i="t_sched"></button><button class="tab" data-tab="mep" data-i="t_mep"></button><button class="tab" data-tab="boq" data-i="t_boq"></button><button class="tab" data-tab="rules" data-i="t_rules"></button><button class="tab" data-tab="sketch" data-i="t_sketch"></button>
    </div>
    <div class="scroll">
      <div class="pane" id="p-sketch">
        <div class="note" data-i="sk_note"></div>
        <div class="bar" style="padding:6px 0;border:0"><button id="sk-import" data-i="sk_import"></button><button id="sk-clear" disabled data-i="sk_clear"></button>
          <span id="sk-pager" style="display:none"><button id="sk-prev">&lsaquo;</button> <span id="sk-pg"></span> <button id="sk-next">&rsaquo;</button></span></div>
        <div id="sk-tools" style="display:none">
          <div class="row"><div><label data-i="sk_known"></label><input id="sk-known" type="number" step="0.01" min="0.01"></div><div><label>&nbsp;</label><button id="sk-t-scale" data-i="sk_t_scale"></button></div></div>
          <div class="bar" style="padding:6px 0;border:0;flex-wrap:wrap"><button id="sk-t-plot" data-i="sk_t_plot"></button><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="sk-swap"><span data-i="sk_swap"></span></label></div>
          <div class="row"><div><label data-i="sk_name"></label><input id="sk-name"></div><div><label data-i="r_func"></label><select id="sk-func"></select></div><div><label data-i="sk_floor"></label><input id="sk-floor" type="number" min="1" step="1" value="1"></div></div>
          <div class="bar" style="padding:6px 0;border:0;flex-wrap:wrap"><button id="sk-t-room" data-i="sk_t_room"></button><button id="sk-reset" data-i="sk_reset"></button><button id="sk-zin">+</button><button id="sk-zout">&minus;</button></div>
        </div>
        <div id="sk-status" class="note"></div>
        <div id="sk-wrap" style="overflow:auto;max-height:62vh;border:1px solid #8886"><canvas id="sk-cv" style="width:100%;display:block;cursor:crosshair"></canvas></div>
      </div>
      <div class="pane on" id="p-notes"><div class="empty" data-i="notes_empty"></div></div>
      <div class="pane" id="p-qto"><div class="empty" data-i="qto_empty"></div></div>
      <div class="pane" id="p-sched">
        <div class="note" data-i="sched_note"></div>
        <div class="row"><div><label data-i="start"></label><input id="start" type="date"></div><div><label data-i="zones"></label><input id="zones" type="number" min="1" value="1"></div></div>
        <label data-i="workdays"></label>
        <div class="chk" id="wd"></div>
        <div style="margin:6px 0"><button id="wd-sunthu" data-i="sun_thu"></button> <button id="wd-monfri" data-i="mon_fri"></button></div>
        <label data-i="holidays"></label><input id="holidays" placeholder="2027-03-01, 2027-03-02">
        <h2 data-i="h_rates"></h2>
        <div class="note" data-i="rates_note"></div>
        <button id="rates-example" data-i="rates_example"></button>
        <table style="margin-top:8px"><thead><tr><th data-i="activity"></th><th data-i="rate"></th><th data-i="crews"></th><th data-i="source"></th></tr></thead><tbody id="rates"></tbody></table>
        <div class="bar" style="padding:10px 0;border:0"><button id="runsched" class="primary" data-i="run_sched"></button><button id="exportsched" disabled data-i="export_csv"></button></div>
        <div id="schedout"></div>
      </div>
      <div class="pane" id="p-mep">
        <div class="note" data-i="mep_note"></div>
        <textarea id="mepin" spellcheck="false" dir="ltr" style="min-height:220px;text-align:left"></textarea>
        <div class="bar" style="padding:10px 0;border:0;flex-wrap:wrap;gap:6px">
          <button id="mep-example" data-i="mep_example"></button>
          <button id="mep-run" class="primary" data-i="mep_run"></button>
          <button id="mep-apply" data-i="mep_apply"></button>
          <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="showmep"><span data-i="mep_show"></span></label>
        </div>
        <div id="mepout"></div>
      </div>
      <div class="pane" id="p-boq">
        <div class="note" data-i="boq_note"></div>
        <textarea id="boqin" spellcheck="false" dir="ltr" style="min-height:220px;text-align:left"></textarea>
        <div class="bar" style="padding:10px 0;border:0;flex-wrap:wrap;gap:6px">
          <button id="boq-example" data-i="boq_example"></button>
          <button id="boq-run" class="primary" data-i="boq_run"></button>
        </div>
        <div class="bar" style="padding:0 0 10px;border:0;flex-wrap:wrap;gap:6px">
          <button id="boq-doc" data-i="b_doc"></button><button id="boq-pdf" data-i="b_pdf"></button><button id="boq-xlsx" data-i="b_xlsx"></button><button id="boq-csv" data-i="b_csv"></button><button id="boq-mat" data-i="b_matcsv"></button><button id="boq-spec" data-i="b_speccsv"></button>
        </div>
        <div id="boqout"></div>
      </div>
      <div class="pane" id="p-rules">
        <div class="note" data-i="rules_note"></div>
        <textarea id="pack" spellcheck="false" dir="ltr" style="text-align:left"></textarea>
        <div class="bar" style="padding:10px 0;border:0"><button id="runrules" class="primary" data-i="run_rules"></button></div>
        <div id="rulesout"></div>
      </div>
    </div>
  </section>
</main>
<div id="busy"><span data-i="working"></span></div>
<div id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- bridge to the application
const pending = new Map(); let nextId = 1;
window.__resolve = (id, res) => { const p = pending.get(id); if (!p) return; pending.delete(id); if (res.ok && res.data && res.data.levels && Array.isArray(res.data.levels.list)) setLevels(res.data.levels); res.ok ? p.resolve(res.data) : p.reject(new Error(res.error)); };
const call = (cmd, args = {}) => new Promise((resolve, reject) => {
  const id = nextId++; pending.set(id, { resolve, reject });
  window.ipc.postMessage(JSON.stringify({ id, cmd, args }));
});

// ---------------------------------------------------------------- text
const T = {

  subtitle:"مصمم مخططات الفلل", prelim:"أولي — غير صالح للتنفيذ", h_project:"المشروع", title:"اسم المشروع", width:"عرض الأرض (م)", length:"عمق الأرض (م)",

  dead:"حمل ميت (kPa)", live:"حمل حي (kPa)", bearing:"تحمل التربة (kPa)", floors:"عدد الأدوار", maxspan:"أقصى بحر بين الأعمدة (مم)", generate:"ولّد البدائل",
  undo:"تراجع", redo:"إعادة", show_struct:"إظهار الإنشائي", sync:"مزامنة الإنشائي", export_svg:"تصدير SVG", save_proj:"حفظ المشروع",
  alts_empty:"ولّد بدائل التوزيع ثم اختر أحدها", viewer_empty:"لا مخطط بعد", t_notes:"ملاحظات", t_qto:"الكميات", t_sched:"الجدول", t_rules:"الكود",
  notes_empty:"اختر بديلاً لعرض الملاحظات", qto_empty:"اختر بديلاً لعرض الكميات", sched_note:"الجدول يحتاج معدلات الإنتاج من بياناتك. لا قيم افتراضية، وغير المدخل يُرفض بالاسم.",
  start:"تاريخ البدء", zones:"مناطق الصب", workdays:"أيام العمل (الاثنين أولاً)", sun_thu:"الأحد–الخميس", mon_fri:"الاثنين–الجمعة", holidays:"عطل (تواريخ مفصولة بفاصلة)",
  h_rates:"معدلات الإنتاج", rates_note:"كمية لكل طاقم في اليوم، أو عدد أيام ثابت. اذكر المصدر لكل معدل.", rates_example:"املأ بقيم اصطناعية للتجربة فقط",
  activity:"النشاط", rate:"المعدل / الأيام", crews:"طواقم", source:"المصدر", run_sched:"احسب الجدول", export_csv:"تصدير CSV", rules_note:"الصق حزمة قواعد بصيغة JSON (قيم الكود من النص المعتمد). تُفحص على النموذج الحالي.", run_rules:"افحص",
  working:"جارٍ العمل…", cheapest:"الأفضل", cost:"التكلفة", reserve:"ممرات", warnings:"تنبيهات", none:"لا شيء", rooms:"الفراغات", target:"المستهدف", actual:"الفعلي",
  qty:"الكمية", unit:"الوحدة", el:"عناصر", code:"البند", missing:"معدلات ناقصة", days:"يوم عمل", finish:"الانتهاء", saved:"تم الحفظ", cancelled:"أُلغي", error:"خطأ",
  checked:"فُحص", findings:"مخالفات", skipped:"قواعد لم تُفحص", func:{majlis:"مجلس",living:"صالة",dining:"طعام",kitchen:"مطبخ",bedroom:"نوم",bathroom:"حمام",other:"أخرى"},

  const cv = $("sk-cv"), c = cv.getContext("2d"), b = SK.base;
  if (!b) { c.clearRect(0, 0, cv.width, cv.height); return; }
  cv.width = b.width; cv.height = b.height; c.drawImage(b, 0, 0);
  const lw = Math.max(2, b.width / 500), dot = p => { c.beginPath(); c.arc(p.x, p.y, lw * 2.2, 0, 7); c.fill(); };
  c.lineWidth = lw; c.font = `${lw * 7}px Segoe UI, sans-serif`;
  for (const m of SK.marks) {
    c.strokeStyle = c.fillStyle = m.color;
    if (m.kind === "scale") { c.beginPath(); c.moveTo(m.a.x, m.a.y); c.lineTo(m.b.x, m.b.y); c.stroke(); dot(m.a); dot(m.b); }
    else { c.strokeRect(Math.min(m.a.x, m.b.x), Math.min(m.a.y, m.b.y), Math.abs(m.a.x - m.b.x), Math.abs(m.a.y - m.b.y)); if (m.label) c.fillText(m.label, Math.min(m.a.x, m.b.x) + lw * 2, Math.min(m.a.y, m.b.y) + lw * 8); }
  }
  c.fillStyle = "#e91e63"; SK.pts.forEach(dot);
  cv.style.width = (SK.zoom * 100) + "%";
}
function skSetBase(canvas, name) {
  SK.base = canvas; SK.ppm = null; SK.marks = []; SK.pts = []; SK.tool = null; SK.name = name;
  $("sk-tools").style.display = ""; $("sk-clear").disabled = false; skDraw(); skMsg("sk_loaded", { name });
}
async function skLoadImage(p) {
  const url = URL.createObjectURL(new Blob([b64bytes(p.b64)], { type: p.mime }));
  const img = new Image();
  await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("the image cannot be read")); img.src = url; });
  const cv = document.createElement("canvas"); cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.getContext("2d").drawImage(img, 0, 0); URL.revokeObjectURL(url);
  SK.pdf = null; $("sk-pager").style.display = "none"; skSetBase(cv, p.name);
}
async function skPdfLib() {
  if (window.pdfjsLib) return window.pdfjsLib;
  const r = await call("sketch_pdfjs"), blob = s => URL.createObjectURL(new Blob([s], { type: "text/javascript" }));
  await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = blob(r.lib); sc.onload = ok; sc.onerror = () => no(new Error("the PDF engine failed to load")); document.head.appendChild(sc); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = blob(r.worker); return window.pdfjsLib;
}
async function skShowPage(n) {
  const page = await SK.pdf.getPage(n), v1 = page.getViewport({ scale: 1 }), scale = Math.min(4, 2400 / Math.max(v1.width, v1.height)), vp = page.getViewport({ scale });
  const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const c = cv.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: c, viewport: vp }).promise;
  SK.page = n; $("sk-pg").textContent = `${t("sk_page")} ${n} / ${SK.pdf.numPages}`; $("sk-pager").style.display = SK.pdf.numPages > 1 ? "" : "none";
  skSetBase(cv, SK.name);
}
async function skLoadPdf(p) {
  skMsg("sk_busy_pdf"); const lib = await skPdfLib();
  SK.name = p.name; SK.pdf = await lib.getDocument({ data: b64bytes(p.b64) }).promise; await skShowPage(1);
}
$("sk-import").onclick = () => busy(async () => { const r = (await call("pick_sketch")).picked; if (!r) return; if (r.kind === "pdf") await skLoadPdf(r); else await skLoadImage(r); });
$("sk-prev").onclick = () => busy(() => SK.page > 1 ? skShowPage(SK.page - 1) : 0);
$("sk-next").onclick = () => busy(() => SK.pdf && SK.page < SK.pdf.numPages ? skShowPage(SK.page + 1) : 0);
$("sk-clear").onclick = () => { SK.base = null; SK.ppm = null; SK.marks = []; SK.pts = []; SK.pdf = null; SK.tool = null; $("sk-tools").style.display = "none"; $("sk-pager").style.display = "none"; $("sk-clear").disabled = true; $("sk-status").textContent = ""; skDraw(); };
$("sk-reset").onclick = () => { SK.marks = []; SK.pts = []; SK.tool = null; skDraw(); };

function skTool(tool) {
  if (tool !== "scale" && !SK.ppm) { skMsg("sk_need_scale"); return; }
  if (tool === "scale" && !(num("sk-known") > 0)) { skMsg("sk_known_bad"); return; }
  SK.tool = tool; SK.pts = []; skDraw(); skMsg(tool === "scale" ? "sk_pick_scale" : "sk_pick_p1");
}
$("sk-t-scale").onclick = () => skTool("scale"); $("sk-t-plot").onclick = () => skTool("plot"); $("sk-t-room").onclick = () => skTool("room");

// Rooms marked on the sketch, in the frame the engine uses: millimetres, origin at the south-west corner of the
// buildable area (plot minus setbacks), y up. The top of the image is north and the front setback is the south side.
function skPlacement() {
  const plot = SK.marks.find(m => m.kind === "plot");
  if (!SK.base || !SK.ppm || !plot || $("sk-swap").checked) return null;
  const mm = v => v / SK.ppm * 1000, left = Math.min(plot.a.x, plot.b.x), bottom = Math.max(plot.a.y, plot.b.y);
  const sx = (num("sbs") || 0) * 1000, sy = (num("sbf") || 0) * 1000, out = {};
  for (const m of SK.marks) {
    if (m.kind !== "room" || !state.rooms.some(r => r.key === m.key)) continue;
    out[m.key] = { x: mm(Math.min(m.a.x, m.b.x) - left) - sx, y: mm(bottom - Math.max(m.a.y, m.b.y)) - sy, w: mm(Math.abs(m.a.x - m.b.x)), h: mm(Math.abs(m.a.y - m.b.y)) };
  }
  return Object.keys(out).length ? out : null;
}
$("sk-cv").addEventListener("click", ev => {
  if (!SK.base || !SK.tool) return;
  const r = $("sk-cv").getBoundingClientRect(), p = { x: (ev.clientX - r.left) * SK.base.width / r.width, y: (ev.clientY - r.top) * SK.base.height / r.height };
  SK.pts.push(p);
  if (SK.pts.length < 2) { skDraw(); skMsg(SK.tool === "scale" ? "sk_pick_scale" : "sk_pick_p2"); return; }
  const [a, b] = SK.pts, dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y); SK.pts = [];
  if (SK.tool === "scale") {
    const d = Math.hypot(dx, dy); if (d < 2) { skDraw(); return; }
    SK.ppm = d / num("sk-known"); SK.marks = SK.marks.filter(m => m.kind !== "scale"); SK.marks.push({ kind: "scale", a, b, color: "#e91e63" }); SK.tool = null; skDraw(); skMsg("sk_scale_set", { px: SK.ppm.toFixed(1) });
  } else if (SK.tool === "plot") {
    let w = dx / SK.ppm, l = dy / SK.ppm; if ($("sk-swap").checked) [w, l] = [l, w];
    $("width").value = w.toFixed(2); $("length").value = l.toFixed(2);
    SK.marks = SK.marks.filter(m => m.kind !== "plot"); SK.marks.push({ kind: "plot", a, b, color: "#2e7d32", label: "" }); SK.tool = null; skDraw(); skMsg("sk_plot_set", { w: w.toFixed(2), l: l.toFixed(2) });
  } else {
    const area = Math.round(dx * dy / (SK.ppm * SK.ppm) * 10) / 10; if (area < 1) { skDraw(); skMsg("sk_small"); return; }
    const func = $("sk-func").value, name = $("sk-name").value.trim(), key = "r" + (Date.now() % 100000);
    state.rooms.push({ key, name, func, area, zone: ZONE_OF[func] || "service", light: func !== "bathroom", floor: Number($("sk-floor").value) || 1 });
    renderRooms(); SK.marks.push({ kind: "room", key, a, b, color: "#1565c0", label: `${name || t("func")[func]} ${area}` }); skDraw(); skMsg("sk_room_added", { a: area }); $("sk-name").value = "";
  }
});

  if (num("stairw") && num("stairl")) brief.stair = { width_m: num("stairw"), length_m: num("stairl"), side: $("stairside").value };
  const res = await call("generate", { brief, struct: structInputs(), placement: skPlacement() });

async function refresh3d(refit) {
  if (!V3.on || !init3()) return;
  try { const sc = await call("model3d"); V3.boxes = sc.boxes; V3.scene = sc;
    { const w = $("v-level-wrap"), sel = $("v-level"), ls = sc.levels || []; w.style.display = ls.length > 1 ? "" : "none";
      sel.innerHTML = `<option value="all">${t("lv_all")}</option>` + ls.map(l => `<option value="${l.index}">${levelLabel(l.index)}</option>`).join("");
      if (ls.length < 2 || (V3.maxLevel != null && V3.maxLevel >= ls.length)) V3.maxLevel = null;
      sel.value = V3.maxLevel == null ? "all" : String(V3.maxLevel); } if (refit) fit3(sc); build3(); draw3(); $("v3-info").textContent = `${V3.boxes.length} ${t("v_solids")}`; }
  catch (e) { V3.boxes = []; V3.buf.nOp = V3.buf.nTr = 0; draw3(); $("v3-info").textContent = t("viewer_empty"); }
}
function setView3(on) {
  V3.on = on; $("v3").style.display = on ? "flex" : "none"; $("viewer").style.display = on ? "none" : "flex"; $("to3d").textContent = on ? t("to2d") : t("to3d");
  if (on) refresh3d(true);
}
$("to3d").onclick = () => setView3(!V3.on);
for (const [id, key] of [["v-slab", "slab"], ["v-struct", "struct"], ["v-floor", "floor"], ["v-glass", "glass"], ["v-mep", "mep"]]) { $(id).checked = V3.show[key]; $(id).onchange = () => { V3.show[key] = $(id).checked; build3(); draw3(); }; }
$("v-level").onchange = () => { const v = $("v-level").value; V3.maxLevel = v === "all" ? null : Number(v); build3(); draw3(); };
$("v-reset").onclick = () => { V3.yaw = -0.8; V3.pitch = 0.55; if (V3.scene) fit3(V3.scene); V3.sel = null; build3(); draw3(); $("v3-pick").textContent = ""; };
$("v-top").onclick = () => { V3.yaw = -Math.PI / 2; V3.pitch = 1.5; draw3(); };
function ray3(ev) {
  const cv = $("gl"), r = cv.getBoundingClientRect(), nx = ((ev.clientX - r.left) / r.width) * 2 - 1, ny = 1 - ((ev.clientY - r.top) / r.height) * 2, e = eye3();
  const f = V3.target.map((v, i) => v - e[i]), fl = Math.hypot(...f), fn = f.map(v => v / fl);
  const rt0 = [fn[1], -fn[0], 0], rl = Math.hypot(...rt0), rt = rt0.map(v => v / rl);
  const up = [rt[1] * fn[2] - rt[2] * fn[1], rt[2] * fn[0] - rt[0] * fn[2], rt[0] * fn[1] - rt[1] * fn[0]], th = Math.tan(0.4), asp = r.width / r.height;
  return { o: e, d: fn.map((v, i) => v + rt[i] * nx * th * asp + up[i] * ny * th) };
}
function pick3(ev) {
  const { o, d } = ray3(ev); let best = null, bt = Infinity;
  for (const b of V3.boxes) {
    if (!visible3(b)) continue;
    let t0 = -Infinity, t1 = Infinity;
    for (let i = 0; i < 3; i++) { if (Math.abs(d[i]) < 1e-12) { if (o[i] < b.min[i] || o[i] > b.max[i]) { t0 = Infinity; break; } continue; } let a = (b.min[i] - o[i]) / d[i], c = (b.max[i] - o[i]) / d[i]; if (a > c) [a, c] = [c, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, c); }
    if (t0 <= t1 && t1 > 0 && t0 < bt) { bt = Math.max(t0, 0); best = b; }
  }

}
const gl3 = $("gl");
gl3.addEventListener("mousedown", e => { V3.drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey, moved: 0 }; });
window.addEventListener("mouseup", async e => {
  const d = V3.drag; V3.drag = null; if (!d || !V3.on || d.moved > 4 || e.target !== gl3) return;
  const b = pick3(e); V3.sel = b ? b.id : null; build3(); draw3();
  if (!b) { $("v3-pick").textContent = ""; return; }
  $("v3-pick").textContent = `${b.kind}${b.class ? " / " + b.class : ""}${b.visual ? " (" + t("v_visual") + ")" : ""} · ${b.id}`;
});
window.addEventListener("mousemove", e => {
  const d = V3.drag; if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; d.x = e.clientX; d.y = e.clientY; d.moved += Math.abs(dx) + Math.abs(dy);
  if (d.pan) { const k = V3.dist * 0.0016, c = Math.cos(V3.yaw), s = Math.sin(V3.yaw); V3.target[0] += (s * dx - c * dy * Math.sin(V3.pitch)) * k; V3.target[1] += (-c * dx - s * dy * Math.sin(V3.pitch)) * k; }
  else { V3.yaw -= dx * 0.007; V3.pitch = Math.max(-0.1, Math.min(1.5, V3.pitch + dy * 0.007)); }
  draw3();
});
gl3.addEventListener("wheel", e => { e.preventDefault(); V3.dist = Math.max(2, Math.min(300, V3.dist * Math.exp(e.deltaY * 0.001))); draw3(); }, { passive: false });
gl3.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("resize", () => draw3());

// ---------------------------------------------------------------- code rules
$("runrules").onclick = () => busy(async () => {
  const r = await call("check_rules", { pack: $("pack").value });
  $("rulesout").innerHTML = `<h2>${t("checked")}: ${r.checked}</h2><div class="note">${r.layers.map(esc).join(" → ")}</div>
    <h2>${t("findings")} (${r.findings.length})</h2><ul class="clean">${r.findings.map(f => `<li class="${f.severity === "error" ? "bad" : "warn"}">${esc(f.rule)} [${esc(f.clause)}] ${esc(f.message)}</li>`).join("") || `<li class="ok">${t("none")}</li>`}</ul>
    <h2>${t("skipped")} (${r.skipped.length})</h2><ul class="clean">${r.skipped.map(s => `<li class="warn">${esc(s.rule)}: ${esc(s.reason)}</li>`).join("")}</ul>`;
});

// ---------------------------------------------------------------- editing the plan
// Every edit is a command to the application; the plan is redrawn from the model afterwards.
const PX_PER_MM = 0.05; // the plan is drawn at 50 px per metre (DrawOpts::default)
function clearSel() { const i = $("inspector"); if (i) { i.style.display = "none"; i.innerHTML = ""; } document.querySelectorAll("#viewer .sel").forEach(e => e.classList.remove("sel")); }
async function afterEdit(r) {
  showPlan(r.svg); if (r.rooms) { state.rooms_out = r.rooms; renderNotes(); }
  state.qto = null; state.sched = null; state.mep = null; state.boq = null; if ($("mepout")) $("mepout").innerHTML = ""; if ($("boqout")) $("boqout").innerHTML = ""; refreshStatus(); loadQto();
  toast(r.mep_cleared ? t("m_cleared").replace("{n}", r.mep_cleared) : t("i_done"));
}
async function selectElement(el) {
  const info = await call("describe", { id: el.dataset.id });
  document.querySelectorAll("#viewer .sel").forEach(e => e.classList.remove("sel")); el.classList.add("sel");
  const box = $("inspector"); box.style.display = "flex";
  const clear = `<button id="i-clear">${t("i_clear")}</button>`;
  if (info.kind === "Wall") {
    box.innerHTML = info.movable
      ? `<b>${t("i_wall")} ${esc(info.rooms[0])} / ${esc(info.rooms[1])}</b> <span>${t("i_len")} ${info.length}</span>
         <label style="margin:0">${t("i_move")}</label><input id="i-delta" type="number" step="50" value="100">
         <button id="i-minus">−</button><button id="i-plus">+</button> ${clear}<span class="hint">${t("i_hint")}</span>`
      : `<b>${t("i_ext")}</b> ${clear}`;
    if (info.movable) { const d = () => Number($("i-delta").value) || 0; $("i-minus").onclick = () => busy(async () => afterEdit(await call("move_partition", { wall: info.id, delta_mm: -d() }))); $("i-plus").onclick = () => busy(async () => afterEdit(await call("move_partition", { wall: info.id, delta_mm: d() }))); }
  } else if (info.kind === "Door" || info.kind === "Window") {
    box.innerHTML = `<b>${t(info.kind === "Door" ? "i_door" : "i_window")}</b> <label style="margin:0">${t("i_width")}</label><input id="i-w" type="number" step="50" value="${info.width}">
      <label style="margin:0">${t("i_offset")}</label><input id="i-o" type="number" step="50" value="${info.offset}"> <span class="hint">/ ${info.wall_length}</span>
      <button id="i-apply" class="primary">${t("i_apply")}</button><button id="i-del">${t("i_delete")}</button> ${clear}`;
    $("i-apply").onclick = () => busy(async () => { const r = await call("set_opening", { id: info.id, width: Number($("i-w").value), offset: Number($("i-o").value) }); await afterEdit(r); const again = document.querySelector(`#viewer [data-id="${info.id}"]`); if (again) selectElement(again); });
    $("i-del").onclick = () => busy(async () => afterEdit(await call("delete_opening", { id: info.id })));
  } else {
    box.innerHTML = `<b>${t("i_room")}</b> ${esc(info.key)} · ${info.area} m² (${info.w} × ${info.h}) ${clear}`;
  }
  $("i-clear").onclick = clearSel;
}
// Doors, windows and partitions are only a few pixels thick on screen, so a pointer near them counts as on them.
function nearRect(e, rect, pad) { const b = rect.getBoundingClientRect(); return e.clientX >= b.left - pad && e.clientX <= b.right + pad && e.clientY >= b.top - pad && e.clientY <= b.bottom + pad; }
function pickOpening(e) { return [...document.querySelectorAll("#viewer g.door, #viewer g.window")].find(g => { const c = g.querySelector("rect.cut"); return c && nearRect(e, c, 8); }); }
function pickPartition(e) {
  const direct = e.target.closest("rect.wall.int[data-id]"); if (direct) return direct;
  return [...document.querySelectorAll("#viewer rect.wall.int[data-id]")].find(r => nearRect(e, r, 5));
}
const drag = { el: null, x: 0, y: 0, moved: false, horizontal: false };
$("viewer").addEventListener("mousedown", e => {
  const el = pickOpening(e) ? null : pickPartition(e);
  if (!el || e.button !== 0) return;
  e.preventDefault();
  const b = el.getBoundingClientRect();
  Object.assign(drag, { el, x: e.clientX, y: e.clientY, moved: false, horizontal: b.width > b.height });
});
document.addEventListener("mousemove", e => {
  if (!drag.el) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  const svg = drag.el.ownerSVGElement, k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  drag.el.style.transform = drag.horizontal ? `translate(0px, ${dy / k}px)` : `translate(${dx / k}px, 0px)`;
});
document.addEventListener("mouseup", e => {
  if (!drag.el) return;
  const el = drag.el; drag.el = null;
  if (!drag.moved) return; // a plain click is handled below
  const svg = el.ownerSVGElement, k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  // Screen up is model +y; screen right is model +x. Snap to 50 mm.
  const raw = drag.horizontal ? -(e.clientY - drag.y) / k / PX_PER_MM : (e.clientX - drag.x) / k / PX_PER_MM;
  const delta = Math.round(raw / 50) * 50;
  el.style.transform = "";
  if (delta === 0) return;
  busy(async () => afterEdit(await call("move_partition", { wall: el.dataset.id, delta_mm: delta })));
});
$("viewer").addEventListener("click", e => {
  if (drag.moved) { drag.moved = false; return; }
  const el = pickOpening(e) || pickPartition(e) || e.target.closest("[data-id]");
  if (el && el.ownerSVGElement) busy(async () => selectElement(el));

// ---------------------------------------------------------------- open a saved project
function applySettings(s) {
  const b = s.brief || {}, st = s.structure || {};
  $("title").value = b.title ?? s.title ?? "";
  for (const [id, k] of [["width", "width_m"], ["length", "length_m"], ["sbf", "setback_front_m"], ["sbb", "setback_back_m"], ["sbs", "setback_side_m"]]) $(id).value = b[k] ?? "";
  $("entry").value = b.entry || "south";
  if (Array.isArray(b.rooms)) { state.rooms = b.rooms.map(x => ({ key: x.key, name: x.name || "", func: x.func, area: x.area, zone: x.zone, light: !!x.light, floor: x.floor || 1 })); renderRooms(); }
  $("stairw").value = (b.stair || {}).width_m ?? ""; $("stairl").value = (b.stair || {}).length_m ?? ""; $("stairside").value = (b.stair || {}).side || "west";
  for (const [id, k] of [["dead", "dead_kpa"], ["live", "live_kpa"], ["bearing", "bearing_kpa"], ["floors", "floors"], ["maxspan", "max_span_mm"]]) $(id).value = st[k] ?? "";
  $("showstruct").checked = !!s.show_structure;
  $("mepin").value = s.mep && Object.keys(s.mep).length ? JSON.stringify(s.mep, null, 2) : "";
  $("showmep").checked = !!s.show_mep; state.mep = null; $("mepout").innerHTML = "";
  $("boqin").value = s.boq && Object.keys(s.boq).length ? JSON.stringify(s.boq, null, 2) : ""; state.boq = null; $("boqout").innerHTML = "";
}
$("openproj").onclick = () => busy(async () => {
  const st = await call("status");
  if (st.dirty && !confirm(t("discard_q"))) return;
  const r = await call("open_project");
  if (!r.opened) return;
  applySettings(r.settings || {});
  state.alts = []; state.sel = -1; state.qto = null; state.sched = null;
  $("alts").innerHTML = `<div class="empty">${t("alts_empty")}</div>`;
  showPlan(r.svg); state.notes = r.warnings; state.rooms_out = r.rooms;
  renderNotes(); setPlanButtons(true); refreshStatus(); loadQto(); toast(t("opened") + ": " + r.opened);
});

applyLang();
call("assumptions").then(a => { state.assumptions = a; if (state.rooms_out) renderNotes(); });
