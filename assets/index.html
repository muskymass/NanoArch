<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoArch</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c1f24;--mute:#5d6572;--line:#dfe2e7;--accent:#1f5fae;--accent-ink:#fff;--warn:#a65b00;--bad:#b3261e;--ok:#1b7a43;--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171b;--panel:#1d2127;--ink:#e8eaee;--mute:#9aa3b0;--line:#2e343c;--accent:#5b9cf0;--accent-ink:#0b1320;--warn:#e0a24a;--bad:#f2837c;--ok:#5fcf8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:700}
header .sub{color:var(--mute);font-size:12px}
header .grow{flex:1}
main{flex:1;display:grid;grid-template-columns:400px 1fr 420px;gap:12px;padding:12px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.scroll{overflow:auto;padding:12px;flex:1}
h2{font-size:13px;margin:14px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input[type=checkbox]{width:auto}
textarea{min-height:110px;font-family:Consolas,monospace;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--mute);margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td input,td select{padding:3px 5px;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.alts{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);min-height:112px}
.alt{flex:0 0 auto;width:130px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:2px;position:relative}
.alt.sel{border-color:var(--accent)}
.alt svg{width:100%;height:auto;display:block;max-height:118px}
.alt .tag{position:absolute;top:2px;inset-inline-start:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 4px}
#v3{flex:1;display:none;flex-direction:column;min-height:0;background:#f3f5f8}
#v3 .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid #ddd}
#v3 .tools label{display:flex;gap:4px;align-items:center;margin:0}
#gl{flex:1;width:100%;min-height:0;display:block;cursor:grab;touch-action:none}
#viewer{flex:1;overflow:auto;padding:8px;background:#fff;display:flex;justify-content:center;align-items:flex-start}
#viewer svg{width:100%;max-width:820px;height:auto;flex:0 0 auto}
#viewer svg .wall.int,#viewer svg .door,#viewer svg .window,#viewer svg .room{cursor:pointer}
#viewer svg .sel{stroke:#e6a100!important;stroke-width:4!important}
#viewer svg g.sel .leaf,#viewer svg g.sel .glass{stroke:#e6a100!important;stroke-width:3!important}
#inspector input{width:90px}
#inspector .hint{color:var(--mute);font-size:12px}
.rooms{table-layout:fixed}
.rooms th,.rooms td{padding:3px 2px}
.rooms th:nth-child(1){width:27%}.rooms th:nth-child(2){width:19%}.rooms th:nth-child(3){width:15%}.rooms th:nth-child(4){width:19%}.rooms th:nth-child(5){width:8%}.rooms th:nth-child(6){width:12%}
.rooms select{padding:3px 1px;font-size:11px}
.rooms input[type=number]{width:100%!important}
.rooms button{padding:2px 6px}
.empty{color:var(--mute);padding:32px;text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:9px 6px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none}.pane.on{display:block}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
ul.clean{margin:0;padding-inline-start:18px}
ul.clean li{margin:3px 0}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)}
.sugg{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.missing{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:8px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--mute)}
#busy{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;z-index:9}
#busy.on{display:flex}
#toast{position:fixed;bottom:16px;inset-inline-start:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:10;max-width:60vw}
#toast.on{opacity:1}
@media (max-width:1200px){main{grid-template-columns:340px 1fr 340px}}
</style>
</head>
<body>
<header>
  <h1>NanoArch</h1><span class="sub" data-i="subtitle"></span>
  <span class="grow"></span>
  <span class="badge" data-i="prelim"></span>
  <button id="lang">English</button>
</header>
<main>
  <!-- ============ brief ============ -->
  <section class="col">
    <div class="scroll">
      <h2 data-i="h_tpl"></h2>
      <div class="note" data-i="tpl_note"></div>
      <div id="tpl-list" style="display:flex;flex-direction:column;gap:6px"></div>
      <div id="tpl-out"></div>

      <h2 data-i="h_ai"></h2>
      <div class="note" data-i="ai_note"></div>
      <textarea id="ai-text" rows="3" style="width:100%" data-ph="ai_ph"></textarea>
      <div class="row"><div><label data-i="ai_endpoint"></label><input id="ai-endpoint" dir="ltr" value="http://localhost:11434"></div>
      <div><label data-i="ai_model"></label><select id="ai-model"><option value=""></option></select></div></div>
      <div class="bar" style="padding:6px 0;border:0;flex-wrap:wrap;gap:6px"><button id="ai-check" data-i="ai_check"></button><button id="ai-run" class="primary" data-i="ai_run"></button><span id="ai-status" class="badge"></span></div>
      <div id="ai-out"></div>

      <h2 data-i="h_project"></h2>
      <label data-i="title"></label><input id="title">
      <label data-i="plot_shape"></label>
      <select id="plot-shape"><option value="rect" data-i="shape_rect"></option><option value="poly" data-i="shape_poly"></option></select>
      <div id="poly-box" style="display:none">
        <div class="note" data-i="poly_note"></div>
        <div class="bar" style="padding:4px 0;border:0;flex-wrap:wrap;gap:6px"><button id="tpl-trap" data-i="tpl_trap"></button><button id="tpl-chamfer" data-i="tpl_chamfer"></button><button id="tpl-l" data-i="tpl_l"></button></div>
        <table class="rooms"><thead><tr><th>#</th><th>x (m)</th><th>y (m)</th><th data-i="edge_kind"></th><th data-i="street_w"></th><th data-i="edge_sb"></th><th></th></tr></thead><tbody id="poly-rows"></tbody></table>
        <div class="bar" style="padding:6px 0;border:0;flex-wrap:wrap;gap:6px"><button id="poly-add" data-i="poly_add"></button>
          <select id="poly-rule" style="width:auto"><option value="ministry_villa" data-i="rule_villa"></option><option value="ministry_apartment" data-i="rule_apt"></option><option value="manual" data-i="rule_manual"></option></select>
          <button id="poly-analyze" class="primary" data-i="poly_analyze"></button></div>
        <div id="poly-out"></div>
      </div>
      <div class="row"><div><label data-i="width"></label><input id="width" type="number" step="0.1" min="0"></div>
      <div><label data-i="length"></label><input id="length" type="number" step="0.1" min="0"></div></div>
      <div class="row3"><div><label data-i="sb_front"></label><input id="sbf" type="number" step="0.1" min="0" value="0"></div>
      <div><label data-i="sb_back"></label><input id="sbb" type="number" step="0.1" min="0" value="0"></div>
      <div><label data-i="sb_side"></label><input id="sbs" type="number" step="0.1" min="0" value="0"></div></div>
      <div class="note" data-i="sb_note"></div>
      <label data-i="entry"></label>
      <select id="entry"><option value="south" data-i="south"></option><option value="north" data-i="north"></option><option value="east" data-i="east"></option><option value="west" data-i="west"></option></select>

      <h2 data-i="h_rooms"></h2>
      <table class="rooms"><thead><tr><th data-i="r_name"></th><th data-i="r_func"></th><th data-i="r_area"></th><th data-i="r_zone"></th><th data-i="r_floor"></th><th>☀</th><th></th></tr></thead><tbody id="rooms"></tbody></table>
      <div class="bar" style="padding:8px 0;border:0"><button id="addroom" data-i="add_room"></button><button id="example" data-i="example"></button><button id="example2" data-i="example2"></button></div>

      <h2 data-i="h_struct"></h2>
      <div class="note" data-i="struct_note"></div>
      <div class="row"><div><label data-i="dead"></label><input id="dead" type="number" step="0.1" min="0"></div>
      <div><label data-i="live"></label><input id="live" type="number" step="0.1" min="0"></div></div>
      <div class="row"><div><label data-i="bearing"></label><input id="bearing" type="number" step="1" min="0"></div>
      <div><label data-i="floors"></label><input id="floors" type="number" step="1" min="1" value="1"></div></div>
      <div class="note" data-i="stair_note"></div>
      <div class="row"><div><label data-i="stair_w"></label><input id="stairw" type="number" step="0.1" min="0"></div>
      <div><label data-i="stair_l"></label><input id="stairl" type="number" step="0.1" min="0"></div></div>
      <label data-i="stair_side"></label><select id="stairside"><option value="west" data-i="west"></option><option value="east" data-i="east"></option></select>
      <label data-i="maxspan"></label><input id="maxspan" type="number" step="100" min="0">
    </div>
    <div class="bar"><button id="generate" class="primary" style="flex:1" data-i="generate"></button></div>
  </section>

  <!-- ============ plan ============ -->
  <section class="col">
    <div class="bar">
      <button id="openproj" data-i="open_proj"></button>
      <button id="undo" disabled data-i="undo"></button><button id="redo" disabled data-i="redo"></button>
      <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="showstruct"><span data-i="show_struct"></span></label>
      <button id="sync" disabled data-i="sync"></button>
      <button id="to3d" disabled></button>
      <select id="viewsel" disabled style="width:auto"><option value="plan" data-i="v_plan"></option><option value="north" data-i="v_north"></option><option value="south" data-i="v_south"></option><option value="east" data-i="v_east"></option><option value="west" data-i="v_west"></option><option value="A-A" data-i="v_aa"></option><option value="B-B" data-i="v_bb"></option><option value="site" data-i="v_site"></option><option value="furn" data-i="v_furn"></option></select>
      <input id="sec-at" type="number" step="0.1" style="width:90px" data-title="sec_at" placeholder="m">
      <span style="flex:1"></span>
      <span id="savestate" class="badge"></span>
      <button id="exportsvg" disabled data-i="export_svg"></button><button id="exportifc" disabled data-i="export_ifc"></button><button id="exportdxf" disabled data-i="export_dxf"></button><button id="exportdxfall" disabled style="display:none" data-i="export_dxf_all"></button><label style="display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="dxfviews"><span data-i="dxf_views"></span></label><button id="exportrep" disabled data-i="rep_pdf"></button><button id="exportrepx" disabled data-i="rep_xlsx"></button><button id="exportpdf" disabled data-i="export_pdf"></button><button id="saveproj" disabled data-i="save_proj"></button>
    </div>
    <div class="alts" id="alts"><div class="empty" data-i="alts_empty"></div></div>
    <div id="levelbar" class="bar" style="display:none;gap:6px;padding:6px 8px"></div>
    <div id="inspector" class="bar" style="display:none"></div>
    <div id="viewer"><div class="empty" data-i="viewer_empty"></div></div>
    <div id="v3">
      <div class="tools">
        <label><input type="checkbox" id="v-slab"><span data-i="v_slab"></span></label>
        <label><input type="checkbox" id="v-struct"><span data-i="v_struct"></span></label>
        <label><input type="checkbox" id="v-floor"><span data-i="v_floor"></span></label>
        <label><input type="checkbox" id="v-glass"><span data-i="v_glass"></span></label>
        <label><input type="checkbox" id="v-mep"><span data-i="v_mep"></span></label>
        <label><input type="checkbox" id="v-d-architectural"><span data-i="d_architectural"></span></label><label><input type="checkbox" id="v-d-structural"><span data-i="d_structural"></span></label><label><input type="checkbox" id="v-d-electrical"><span data-i="d_electrical"></span></label><label><input type="checkbox" id="v-d-plumbing"><span data-i="d_plumbing"></span></label><label><input type="checkbox" id="v-d-hvac"><span data-i="d_hvac"></span></label>
        <label id="v-level-wrap" style="display:none"><span data-i="v_level"></span> <select id="v-level"></select></label>
        <label><input type="checkbox" id="v-4d"><span data-i="v_4d"></span></label>
        <button id="v-play" data-i="v_play"></button><input type="range" id="v-day" min="0" max="0" value="0" style="width:170px">
        <span id="v-day-info" class="note"></span>
        <button id="v-top" data-i="v_top"></button><button id="v-reset" data-i="v_reset"></button>
        <span id="v3-info" class="note"></span>
      </div>
      <canvas id="gl"></canvas>
      <div class="tools"><span class="note" data-i="v_hint"></span><span id="v3-pick" style="font-weight:600"></span></div>
    </div>
  </section>

  <!-- ============ results ============ -->
  <section class="col">
    <div class="tabs">
      <button class="tab on" data-tab="notes" data-i="t_notes"></button><button class="tab" data-tab="qto" data-i="t_qto"></button>
      <button class="tab" data-tab="sched" data-i="t_sched"></button><button class="tab" data-tab="mep" data-i="t_mep"></button><button class="tab" data-tab="boq" data-i="t_boq"></button><button class="tab" data-tab="rules" data-i="t_rules"></button><button class="tab" data-tab="sbc" data-i="t_sbc"></button><button class="tab" data-tab="bim" data-i="t_bim"></button><button class="tab" data-tab="str" data-i="t_str"></button><button class="tab" data-tab="sketch" data-i="t_sketch"></button><button class="tab" data-tab="an" id="tab-an"></button>
    </div>
    <div class="scroll">
      <div class="pane" id="p-sketch">
        <div class="note" data-i="sk_note"></div>
        <div class="bar" style="padding:6px 0;border:0"><button id="sk-import" data-i="sk_import"></button><button id="sk-clear" disabled data-i="sk_clear"></button>
          <span id="sk-pager" style="display:none"><button id="sk-prev">&lsaquo;</button> <span id="sk-pg"></span> <button id="sk-next">&rsaquo;</button></span></div>
        <div id="sk-tools" style="display:none">
          <div class="row"><div><label data-i="sk_known"></label><input id="sk-known" type="number" step="0.01" min="0.01"></div><div><label>&nbsp;</label><button id="sk-t-scale" data-i="sk_t_scale"></button></div></div>
          <div class="bar" style="padding:6px 0;border:0;flex-wrap:wrap"><button id="sk-t-plot" data-i="sk_t_plot"></button><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="sk-swap"><span data-i="sk_swap"></span></label></div>
          <div class="row"><div><label data-i="sk_name"></label><input id="sk-name"></div><div><label data-i="r_func"></label><select id="sk-func"></select></div><div><label data-i="sk_floor"></label><input id="sk-floor" type="number" min="1" step="1" value="1"></div></div>
          <div class="bar" style="padding:6px 0;border:0;flex-wrap:wrap"><button id="sk-t-room" data-i="sk_t_room"></button><button id="sk-reset" data-i="sk_reset"></button><button id="sk-zin">+</button><button id="sk-zout">&minus;</button></div>
        </div>
        <div id="sk-status" class="note"></div>
        <div id="sk-wrap" style="overflow:auto;max-height:62vh;border:1px solid #8886"><canvas id="sk-cv" style="width:100%;display:block;cursor:crosshair"></canvas></div>
      </div>
      <div class="pane on" id="p-notes"><div class="empty" data-i="notes_empty"></div></div>
      <div class="pane" id="p-qto"><div class="empty" data-i="qto_empty"></div></div>
      <div class="pane" id="p-sched">
        <div class="note" data-i="sched_note"></div>
        <div class="row"><div><label data-i="start"></label><input id="start" type="date"></div><div><label data-i="zones"></label><input id="zones" type="number" min="1" value="1"></div></div>
        <label data-i="workdays"></label>
        <div class="chk" id="wd"></div>
        <div style="margin:6px 0"><button id="wd-sunthu" data-i="sun_thu"></button> <button id="wd-monfri" data-i="mon_fri"></button></div>
        <label data-i="holidays"></label><input id="holidays" placeholder="2027-03-01, 2027-03-02">
        <h2 data-i="h_rates"></h2>
        <div class="note" data-i="rates_note"></div>
        <button id="rates-example" data-i="rates_example"></button>
        <table style="margin-top:8px"><thead><tr><th data-i="activity"></th><th data-i="rate"></th><th data-i="crews"></th><th data-i="source"></th></tr></thead><tbody id="rates"></tbody></table>
        <div class="bar" style="padding:10px 0;border:0"><button id="runsched" class="primary" data-i="run_sched"></button><button id="exportsched" disabled data-i="export_csv"></button></div>
        <div id="schedout"></div>
      </div>
      <div class="pane" id="p-mep">
        <div class="note" data-i="mep_note"></div>
        <textarea id="mepin" spellcheck="false" dir="ltr" style="min-height:220px;text-align:left"></textarea>
        <div class="bar" style="padding:10px 0;border:0;flex-wrap:wrap;gap:6px">
          <button id="mep-example" data-i="mep_example"></button>
          <button id="mep-run" class="primary" data-i="mep_run"></button>
          <button id="mep-apply" data-i="mep_apply"></button>
          <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="showmep"><span data-i="mep_show"></span></label>
        </div>
        <div id="mepout"></div>
      </div>
      <div class="pane" id="p-boq">
        <div class="note" data-i="boq_note"></div>
        <textarea id="boqin" spellcheck="false" dir="ltr" style="min-height:220px;text-align:left"></textarea>
        <div class="bar" style="padding:10px 0;border:0;flex-wrap:wrap;gap:6px">
          <button id="boq-example" data-i="boq_example"></button>
          <button id="boq-run" class="primary" data-i="boq_run"></button>
        </div>
        <div class="bar" style="padding:0 0 10px;border:0;flex-wrap:wrap;gap:6px">
          <button id="boq-doc" data-i="b_doc"></button><button id="boq-pdf" data-i="b_pdf"></button><button id="boq-xlsx" data-i="b_xlsx"></button><button id="boq-csv" data-i="b_csv"></button><button id="boq-mat" data-i="b_matcsv"></button><button id="boq-spec" data-i="b_speccsv"></button>
        </div>
        <div id="boqout"></div>
      </div>
      <div class="pane" id="p-sbc">
        <div class="note" data-i="sbc_note"></div>
        <div class="row"><div><label data-i="bt"></label><select id="p-btype"><option value=""></option><option value="villa" data-i="bt_villa"></option><option value="house" data-i="bt_house"></option><option value="palace" data-i="bt_palace"></option><option value="apartment_building" data-i="bt_apartment_building"></option></select></div>
          <div><label data-i="p_style"></label><input id="p-style" list="style-list"><datalist id="style-list"><option value="modern_najdi"></option><option value="contemporary"></option><option value="neo_classical"></option><option value="minimalist"></option></datalist></div></div>
        <div class="row"><div><label data-i="p_climate"></label><input id="p-climate"></div><div><label data-i="p_smart"></label><input id="p-smart"></div></div>
        <label data-i="p_parapet"></label><input id="p-parapet" type="number" step="0.1" min="0">
        <h2 data-i="lim_h"></h2>

function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i)); document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph)); document.querySelectorAll("[data-title]").forEach(e => { e.title = t(e.dataset.title); });

// ---------------------------------------------------------------- state and helpers
const state = { rooms: [{ key: "r1", name: "", func: "living", area: 30, zone: "public", light: true }], alts: [], sel: -1, notes: null, rooms_out: null, qto: null, sched: null, keys: [], rates: {} };
const FUNCS = ["majlis", "living", "dining", "kitchen", "bedroom", "bathroom", "other"], ZONES = ["public", "private", "service"];
function toast(m) { const e = $("toast"); e.textContent = m; e.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), 3200); }
async function busy(fn) {
  $("busy").classList.add("on"); await new Promise(r => setTimeout(r, 40));
  try { return await fn(); } catch (e) { toast(t("error") + ": " + e.message); } finally { $("busy").classList.remove("on"); }
}
const num = id => { const v = $(id).value.trim(); return v === "" ? null : Number(v); };

// ---------------------------------------------------------------- rooms form
function renderRooms() {
  const tb = $("rooms"); tb.innerHTML = "";
  state.rooms.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input value="${esc(r.name)}" data-f="name" placeholder="${esc(r.key)}"></td>
      <td><select data-f="func">${FUNCS.map(f => `<option value="${f}" ${f === r.func ? "selected" : ""}>${t("func")[f]}</option>`).join("")}</select></td>
      <td><input type="number" step="0.5" min="1" value="${r.area}" data-f="area" style="width:54px" class="${r.suggested ? "sugg" : ""}" ${r.suggested ? `title="${t("sugg_tip")}"` : ""}></td>
      <td><select data-f="zone">${ZONES.map(z => `<option value="${z}" ${z === r.zone ? "selected" : ""}>${t("zone")[z]}</option>`).join("")}</select></td>
      <td><input type="number" step="1" min="1" value="${r.floor || 1}" data-f="floor" style="width:40px;padding:4px 2px;text-align:center"></td>
      <td><input type="checkbox" ${r.light ? "checked" : ""} data-f="light"></td>
      <td><button data-del="${i}" title="x">×</button></td>`;
    tr.querySelectorAll("[data-f]").forEach(el => el.addEventListener("change", () => {
      const f = el.dataset.f; r[f] = f === "light" ? el.checked : (f === "area" || f === "floor") ? Number(el.value) : el.value;
      if (f === "area") { r.suggested = false; el.classList.remove("sugg"); el.title = ""; }
    }));
    tr.querySelector("[data-del]").addEventListener("click", () => { state.rooms.splice(i, 1); renderRooms(); });
    tb.appendChild(tr);
  });
}
$("addroom").onclick = () => { state.rooms.push({ key: "r" + (Date.now() % 100000), name: "", func: "bedroom", area: 15, zone: "private", light: true, floor: 1 }); renderRooms(); };

function skDraw() {
  const cv = $("sk-cv"), c = cv.getContext("2d"), b = SK.base;
  if (!b) { c.clearRect(0, 0, cv.width, cv.height); return; }
  cv.width = b.width; cv.height = b.height; c.drawImage(b, 0, 0);
  const lw = Math.max(2, b.width / 500), dot = p => { c.beginPath(); c.arc(p.x, p.y, lw * 2.2, 0, 7); c.fill(); };
  c.lineWidth = lw; c.font = `${lw * 7}px Segoe UI, sans-serif`;
  for (const m of SK.marks) {
    c.strokeStyle = c.fillStyle = m.color;
    if (m.kind === "scale") { c.beginPath(); c.moveTo(m.a.x, m.a.y); c.lineTo(m.b.x, m.b.y); c.stroke(); dot(m.a); dot(m.b); }
    else { c.strokeRect(Math.min(m.a.x, m.b.x), Math.min(m.a.y, m.b.y), Math.abs(m.a.x - m.b.x), Math.abs(m.a.y - m.b.y)); if (m.label) c.fillText(m.label, Math.min(m.a.x, m.b.x) + lw * 2, Math.min(m.a.y, m.b.y) + lw * 8); }
  }
  c.fillStyle = "#e91e63"; SK.pts.forEach(dot);
  cv.style.width = (SK.zoom * 100) + "%";
}

}
async function skLoadImage(p) {

  const img = new Image();
  await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("the image cannot be read")); img.src = url; });
  const cv = document.createElement("canvas"); cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.getContext("2d").drawImage(img, 0, 0); URL.revokeObjectURL(url);
  SK.pdf = null; $("sk-pager").style.display = "none"; skSetBase(cv, p.name);
}
async function skPdfLib() {

async function skShowPage(n) {

  const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);

function skTool(tool) {

// Rooms marked on the sketch, in the frame the engine uses: millimetres, origin at the south-west corner of the
// buildable area (plot minus setbacks), y up. The top of the image is north and the front setback is the south side.
function skPlacement() {

  if (!SK.base || !SK.ppm || !plot || $("sk-swap").checked) return null;
  const mm = v => v / SK.ppm * 1000, left = Math.min(plot.a.x, plot.b.x), bottom = Math.max(plot.a.y, plot.b.y);
  const sx = (num("sbs") || 0) * 1000, sy = (num("sbf") || 0) * 1000, out = {};
  for (const m of SK.marks) {
    if (m.kind !== "room" || !state.rooms.some(r => r.key === m.key)) continue;
    out[m.key] = { x: mm(Math.min(m.a.x, m.b.x) - left) - sx, y: mm(bottom - Math.max(m.a.y, m.b.y)) - sy, w: mm(Math.abs(m.a.x - m.b.x)), h: mm(Math.abs(m.a.y - m.b.y)) };
  }

}
$("sk-cv").addEventListener("click", ev => {

  const [a, b] = SK.pts, dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y); SK.pts = [];

  if (d.pan) { const k = V3.dist * 0.0016, c = Math.cos(V3.yaw), s = Math.sin(V3.yaw); V3.target[0] += (s * dx - c * dy * Math.sin(V3.pitch)) * k; V3.target[1] += (-c * dx - s * dy * Math.sin(V3.pitch)) * k; }
  else { V3.yaw -= dx * 0.007; V3.pitch = Math.max(-0.1, Math.min(1.5, V3.pitch + dy * 0.007)); }
  draw3();
});
gl3.addEventListener("wheel", e => { e.preventDefault(); V3.dist = Math.max(2, Math.min(300, V3.dist * Math.exp(e.deltaY * 0.001))); draw3(); }, { passive: false });

// ---------------------------------------------------------------- 4D: the construction schedule on the 3D model
// Each task of the schedule lists the elements it builds and the working days it occupies, [es, ef). At day d an element
// is not yet built (hidden) until its first task starts, active (orange) while a task works on it, built (normal colour) when
// all its tasks have finished. Elements no task cites are always shown.
function load4d() {
  const s = state.sched, f = V3.fourD; f.ids = new Map();
  if (!(s && s.ok)) { f.days = 0; f.tasks = []; f.cal = []; return false; }
  f.days = s.project_days; f.cal = s.calendar || []; f.tasks = s.tasks;
  for (const task of s.tasks) for (const id of task.elements) { if (!f.ids.has(id)) f.ids.set(id, []); f.ids.get(id).push([task.es, task.ef]); }
  const sl = $("v-day"); sl.max = f.days; f.day = Math.min(f.day, f.days); sl.value = f.day;
  return true;
}
function status4d(id) {
  const f = V3.fourD; if (!f || !f.on) return "done";
  const l = f.ids.get(id); if (!l) return "done";
  const d = f.day; if (!l.some(([a]) => a <= d)) return "todo";
  // Active only while a task is working on it; between tasks it stands as built so far.
  return l.some(([a, b]) => a <= d && d < b) ? "active" : "done";
}
function info4d() {
  const f = V3.fourD; if (!f.on) { $("v-day-info").textContent = ""; return; }
  const active = f.tasks.filter(x => x.es <= f.day && f.day < x.ef).map(x => x.name);
  $("v-day-info").textContent = `${t("v_day")} ${f.day}/${f.days}${f.cal[f.day] ? " · " + f.cal[f.day] : ""}${active.length ? " · " + t("s_active") + ": " + active.slice(0, 3).join("، ") + (active.length > 3 ? "…" : "") : ""}`;
}
function redraw4d() { info4d(); if (V3.on) { build3(); draw3(); } }
function stop4d() { const f = V3.fourD; if (f.timer) { clearInterval(f.timer); f.timer = null; } $("v-play").textContent = t("v_play"); }
$("v-4d").onchange = () => {
  const f = V3.fourD;
  if ($("v-4d").checked) { if (!load4d()) { $("v-4d").checked = false; toast(t("v_4d_need")); return; } f.on = true; } else { f.on = false; stop4d(); }
  redraw4d();
};
$("v-day").oninput = () => { V3.fourD.day = Number($("v-day").value); redraw4d(); };
$("v-play").onclick = () => {
  const f = V3.fourD;
  if (f.timer) { stop4d(); return; }
  if (!f.on) { $("v-4d").checked = true; $("v-4d").onchange(); if (!f.on) return; }
  if (f.day >= f.days) f.day = 0;
  $("v-play").textContent = t("v_pause");
  f.timer = setInterval(() => { f.day = Math.min(f.days, f.day + Math.max(1, Math.round(f.days / 120))); $("v-day").value = f.day; redraw4d(); if (f.day >= f.days) stop4d(); }, 120);
};

// Doors, windows and partitions are only a few pixels thick on screen, so a pointer near them counts as on them.
function nearRect(e, rect, pad) { const b = rect.getBoundingClientRect(); return e.clientX >= b.left - pad && e.clientX <= b.right + pad && e.clientY >= b.top - pad && e.clientY <= b.bottom + pad; }
function pickOpening(e) { return [...document.querySelectorAll("#viewer g.door, #viewer g.window")].find(g => { const c = g.querySelector("rect.cut"); return c && nearRect(e, c, 8); }); }
function pickPartition(e) {
  const direct = e.target.closest("rect.wall.int[data-id]"); if (direct) return direct;
  return [...document.querySelectorAll("#viewer rect.wall.int[data-id]")].find(r => nearRect(e, r, 5));
}
const drag = { el: null, x: 0, y: 0, moved: false, horizontal: false };
$("viewer").addEventListener("mousedown", e => {
  const el = pickOpening(e) ? null : pickPartition(e);
  if (!el || e.button !== 0) return;
  e.preventDefault();
  const b = el.getBoundingClientRect();
  Object.assign(drag, { el, x: e.clientX, y: e.clientY, moved: false, horizontal: b.width > b.height });
});
document.addEventListener("mousemove", e => {
  if (!drag.el) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  const svg = drag.el.ownerSVGElement, k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  drag.el.style.transform = drag.horizontal ? `translate(0px, ${dy / k}px)` : `translate(${dx / k}px, 0px)`;
});
document.addEventListener("mouseup", e => {
  if (!drag.el) return;
  const el = drag.el; drag.el = null;
  if (!drag.moved) return; // a plain click is handled below
  const svg = el.ownerSVGElement, k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  // Screen up is model +y; screen right is model +x. Snap to 50 mm.
  const raw = drag.horizontal ? -(e.clientY - drag.y) / k / PX_PER_MM : (e.clientX - drag.x) / k / PX_PER_MM;
  const delta = Math.round(raw / 50) * 50;
  el.style.transform = "";
  if (delta === 0) return;
  busy(async () => afterEdit(await call("move_partition", { wall: el.dataset.id, delta_mm: delta })));
});
$("viewer").addEventListener("click", e => {
  if (drag.moved) { drag.moved = false; return; }
  const el = pickOpening(e) || pickPartition(e) || e.target.closest("[data-id]");
  if (el && el.ownerSVGElement) busy(async () => selectElement(el));
});

  $("an-regen").onclick = () => busy(async () => {
    const res = await call("regenerate");
    state.alts = res.alternatives; state.sel = -1; state.qto = null; state.sched = null; state.rooms_out = null; state.notes = null;
    renderAlts(); $("viewer").innerHTML = `<div class="empty">${t("alts_empty")}</div>`; setPlanButtons(false); await choose(0); anBuild();
  });
  const save = async (meta, view) => {
    const r = await call("project_set", { meta }); applyProject(r.settings); toast(t("proj_saved"));
    if (view) { $("viewsel").value = view; await showView(); }
    if (V3.on) { await setView3(false); await setView3(true); }
    return r;
  };
  $("an-site").onclick = () => busy(() => save({ siteLayout: { wallHeightM: anVal("sl-wh"), wallThicknessM: anVal("sl-wt"), gateWidthM: anVal("sl-gate"), guard: anFp("sl-g", true), carport: anFp("sl-c", true), pool: anFp("sl-p", false), courtyard: anFp("sl-x", false) } }, "site"));
  $("an-furn").onclick = () => busy(async () => {
    await save({ furniture: { minClearMm: anVal("fu-min") } }, "furn");
    const r = await call("furniture");
    out("an-furn-out", `<ul class="clean">${r.report.flags.length ? r.report.flags.map(f => `<li class="bad">${esc(f.func)}: ${esc(f.what)} (${f.gap_mm} &lt; ${f.min_mm} mm)</li>`).join("") : `<li class="ok">${L("لا ممرات أضيق من الحد", "No passage narrower than the limit")}</li>`}</ul>`);
  });
  $("an-vert").onclick = () => busy(async () => {
    const ev = ["ev-cw", "ev-cd", "ev-cs", "ev-cb", "ev-cf", "ev-wall", "ev-pit", "ev-oh", "ev-x", "ev-y", "ev-mrh"].some(i => anVal(i) != null);
    const bs = (anVal("bs-n") || 0) > 0, ax = ["ax-x", "ax-y", "ax-w", "ax-l", "ax-h"].some(i => anVal(i) != null);
    const rampAny = ["rp-w", "rp-run", "rp-max", "rp-x", "rp-y"].some(i => anVal(i) != null);
    const vertical = {
      elevator: ev ? { carWidthMm: anVal("ev-cw"), carDepthMm: anVal("ev-cd"), clearSideMm: anVal("ev-cs"), clearBackMm: anVal("ev-cb"), clearFrontMm: anVal("ev-cf"), wallMm: anVal("ev-wall"), pitMm: anVal("ev-pit"), overheadMm: anVal("ev-oh"), xMm: anVal("ev-x"), yMm: anVal("ev-y"), machineRoom: $("ev-mr").checked, machineRoomHeightMm: anVal("ev-mrh") } : null,
      basement: bs ? { levels: anVal("bs-n"), heightMm: anVal("bs-h"), ramp: rampAny ? { widthMm: anVal("rp-w"), runMm: anVal("rp-run"), xMm: anVal("rp-x"), yMm: anVal("rp-y"), maxSlopePct: anVal("rp-max"), source: $("rp-src").value.trim() || null } : null } : null,
      roofAnnex: ax ? { xMm: anVal("ax-x"), yMm: anVal("ax-y"), widthMm: anVal("ax-w"), lengthMm: anVal("ax-l"), heightMm: anVal("ax-h") } : null,
    };
    await save({ vertical });
    const r = await call("vertical");
    out("an-vert-out", `<ul class="clean">${r.shaft ? `<li>${L("البئر", "Shaft")}: <b dir="ltr">${r.shaft.inner_mm[0]} × ${r.shaft.inner_mm[1]} mm</b> (${L("خارجي", "outer")} ${r.shaft.outer_mm[0]} × ${r.shaft.outer_mm[1]}, ${r.shaft.outer_area_m2} m²) · ${L("الارتفاع الكلي", "total height")} ${r.shaft.total_height_m.toFixed(2)} m · ${r.shaft.stops} ${L("محطة", "stop(s)")}</li>` : ""}
      ${r.basement_levels.length ? `<li>${r.basement_levels.join(", ")} · ${r.basement_area_m2} m² · ${r.basement_volume_m3} m³</li>` : ""}
      ${r.ramp ? `<li class="${r.ramp.ok === false ? "bad" : "ok"}">${L("المنحدر", "Ramp")}: ${r.ramp.slope_pct}%${r.ramp.max_slope_pct != null ? ` / ${r.ramp.max_slope_pct}%` : ""} · ${L("أقصر طول", "shortest run")} ${r.ramp.min_run_mm ?? "-"} mm</li>` : ""}
      ${r.annex_area_m2 ? `<li>${L("الملحق العلوي", "Roof annex")}: ${r.annex_area_m2} m² · ${r.annex_volume_m3} m³</li>` : ""}
      ${r.problems.map(p => `<li class="warn">${esc(p)}</li>`).join("")}</ul>`);
  });
}
// Fills the panel's inputs from the stored project (what undo, redo and opening a file bring back).
function anLoad(m) {
  AN.meta = m || {};
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v ?? ""; };
  const s = AN.meta.siteLayout || {};
  set("sl-wh", s.wallHeightM); set("sl-wt", s.wallThicknessM); set("sl-gate", s.gateWidthM);
  for (const [p, f] of [["sl-g", s.guard], ["sl-c", s.carport], ["sl-p", s.pool], ["sl-x", s.courtyard]]) { set(p + "w", f && f.widthM); set(p + "l", f && f.lengthM); set(p + "h", f && f.heightM); }
  if (AN.meta.furniture) set("fu-min", AN.meta.furniture.minClearMm);
  const v = AN.meta.vertical || {}, e = v.elevator || {}, b = v.basement || {}, r = b.ramp || {}, a = v.roofAnnex || {};
  set("ev-cw", e.carWidthMm); set("ev-cd", e.carDepthMm); set("ev-cs", e.clearSideMm); set("ev-cb", e.clearBackMm); set("ev-cf", e.clearFrontMm); set("ev-wall", e.wallMm); set("ev-pit", e.pitMm); set("ev-oh", e.overheadMm); set("ev-x", e.xMm); set("ev-y", e.yMm); set("ev-mrh", e.machineRoomHeightMm);
  if ($("ev-mr")) $("ev-mr").checked = !!e.machineRoom;
  set("bs-n", b.levels); set("bs-h", b.heightMm); set("rp-w", r.widthMm); set("rp-run", r.runMm); set("rp-x", r.xMm); set("rp-y", r.yMm); set("rp-max", r.maxSlopePct); set("rp-src", r.source);
  set("ax-x", a.xMm); set("ax-y", a.yMm); set("ax-w", a.widthMm); set("ax-l", a.lengthMm); set("ax-h", a.heightMm);
}
anBuild();

// ---------------------------------------------------------------- project details and code check
function projectPayload() {
  const src = $("lim-src").value.trim();
  const lim = (id, k = 1) => { const v = num(id); return v === null ? null : { value: v * k, source: src }; };
  return {
    meta: { title: $("title").value, buildingType: $("p-btype").value || null, style: $("p-style").value.trim() || null, smartTech: $("p-smart").value.split(",").map(s => s.trim()).filter(Boolean), climateZone: $("p-climate").value.trim() || null, parapetHeightM: num("p-parapet"), ...polyMeta(), ...anMetaKeep() },
    limits: { minSetbackFrontM: lim("lim-f"), minSetbackBackM: lim("lim-b"), minSetbackSideM: lim("lim-s"), maxCoverageRatio: lim("lim-c", 0.01), enforce: $("lim-enforce").checked },
  };
}
function applyProject(s) {
  const m = s.meta || {}, l = s.limits || {}, v = p => (p && p.value != null ? p.value : "");
  $("p-btype").value = m.buildingType || ""; $("p-style").value = m.style || ""; $("p-climate").value = m.climateZone || ""; $("p-smart").value = (m.smartTech || []).join(", "); $("p-parapet").value = m.parapetHeightM ?? ""; polyLoad(m); try { anLoad(m); } catch (e) { /* panel not built yet */ }
  $("lim-f").value = v(l.minSetbackFrontM); $("lim-b").value = v(l.minSetbackBackM); $("lim-s").value = v(l.minSetbackSideM);
  $("lim-c").value = l.maxCoverageRatio && l.maxCoverageRatio.value != null ? Math.round(l.maxCoverageRatio.value * 10000) / 100 : "";
  $("lim-src").value = [l.minSetbackFrontM, l.minSetbackBackM, l.minSetbackSideM, l.maxCoverageRatio].map(p => p && p.source).find(Boolean) || "";
  $("lim-enforce").checked = !!l.enforce;
}
function applySetbacks(s) { const b = s.brief || {}; $("sbf").value = b.setback_front_m ?? ""; $("sbb").value = b.setback_back_m ?? ""; $("sbs").value = b.setback_side_m ?? ""; }
function renderSbc(r) {
  state.sbc = r || null; const box = $("sbcout"), tab = document.querySelector('[data-tab="sbc"]');
  if (!r) { box.innerHTML = ""; tab.textContent = t("t_sbc"); return; }
  const ar = lang === "ar", v = r.violations || [], sk = r.skipped || [];
  tab.textContent = t("t_sbc") + (v.length ? ` (${v.length})` : "");
  box.innerHTML = `<h2>${t("checked")}: ${r.checked}</h2>
    <h2>${t("findings")} (${v.length})</h2><ul class="clean">${v.map(x => `<li class="bad">${esc(ar ? x.ar : x.en)} <span class="hint">[${esc(x.code)} ${esc(x.clause)}] ${esc(x.source)}</span></li>`).join("") || `<li class="ok">${t("none")}</li>`}</ul>
    <h2>${t("skipped")} (${sk.length})</h2><ul class="clean">${sk.map(x => `<li class="warn">${esc(ar ? x.ar : x.en)}</li>`).join("")}</ul>`;
}
$("proj-save").onclick = () => busy(async () => {
  const p = projectPayload();
  const r = await call("project_set", { meta: p.meta, limits: p.limits, setbacks: { front_m: num("sbf") || 0, back_m: num("sbb") || 0, side_m: num("sbs") || 0 } });
  applyProject(r.settings); renderSbc(r.sbc); refreshStatus();
  toast(r.plan_outdated ? t("plan_outdated") : t("proj_saved"));
});
// ---------------------------------------------------------------- views, layers, runs and clashes
async function showView() {
  const v = $("viewsel").value;
  if (v === "plan") { const r = await call("svg", { show_structure: $("showstruct").checked }); showPlan(r.svg); return; }
  if (v === "furn") { const r = await call("furniture"); state.svgText = r.svg; state.viewName = "furniture-plan.svg"; $("viewer").innerHTML = r.svg; clearSel(); return; }
  if (v === "site") { const r = await call("site_plan"); state.svgText = r.svg; state.viewName = r.name; $("viewer").innerHTML = r.svg; clearSel(); return; }
  const r = ["north", "south", "east", "west"].includes(v) ? await call("elevation", { side: v }) : await call("section", { name: v, at: num("sec-at") ?? undefined });
  state.svgText = r.svg; state.viewName = r.name; $("viewer").innerHTML = r.svg; clearSel();
}
$("viewsel").onchange = () => { if (V3.on) setView3(false); busy(showView); };
$("sec-at").onchange = () => { if (["A-A", "B-B"].includes($("viewsel").value)) busy(showView); };
for (const d of ["architectural", "structural", "electrical", "plumbing", "hvac"]) { $("v-d-" + d).checked = true; $("v-d-" + d).onchange = () => { V3.disc[d] = $("v-d-" + d).checked; build3(); draw3(); }; }
function renderRuns(rs) {
  $("runs-out").innerHTML = rs.length
    ? `<table class="rooms"><tbody>${rs.map(r => `<tr><td>${t("sys_" + r.system)}</td><td dir="ltr">(${r.x1}, ${r.y1}, ${r.z1}) → (${r.x2}, ${r.y2}, ${r.z2})</td><td dir="ltr">${r.width}×${r.height}</td><td>${r.level ?? ""}</td><td><button data-del="${esc(r.id)}">×</button></td></tr>`).join("")}</tbody></table>`
    : `<div class="note">${t("run_none")}</div>`;
  $("runs-out").querySelectorAll("[data-del]").forEach(b => b.onclick = () => busy(async () => { const r = await call("delete_run", { id: b.dataset.del }); renderRuns(r.runs); renderClashes(r.clashes); }));
}
function renderClashes(c) {
  const list = (c && c.clashes) || [];
  V3.clash = new Set(list.flatMap(k => [k.run_id, k.struct_id]));
  $("clash-out").innerHTML = list.length
    ? `<ul class="clean">${list.map(k => `<li class="bad" data-run="${esc(k.run_id)}" data-st="${esc(k.struct_id)}" style="cursor:pointer">${t("sys_" + k.run_system)} <code dir="ltr">${esc(k.run_id)}</code> × ${esc(k.struct_kind)} <code dir="ltr">${esc(k.struct_id)}</code> · ${k.volume_m3.toFixed(4)} m³</li>`).join("")}</ul>`
    : `<ul class="clean"><li class="ok">${t("clash_none")}</li></ul>`;
  $("clash-out").querySelectorAll("li[data-run]").forEach(li => li.onclick = () => { if (!V3.on) setView3(true); V3.sel = li.dataset.st; build3(); draw3(); $("v3-pick").textContent = li.dataset.st; });
  if (V3.on) { build3(); draw3(); }
}
async function refreshBim() { try { renderRuns(await call("runs")); renderClashes(await call("clashes")); } catch (e) { /* no document yet */ } }
$("clash-run").onclick = () => busy(async () => renderClashes(await call("clashes")));
$("run-add").onclick = () => busy(async () => {
  const n = id => { const v = $(id).value.trim(); if (v === "") throw new Error(lang === "ar" ? "أكمل الإحداثيات والأبعاد" : "Fill in the coordinates and size"); return Math.round(Number(v)); };
  const a = { system: $("run-sys").value, x1: n("run-x1"), y1: n("run-y1"), z1: n("run-z1"), x2: n("run-x2"), y2: n("run-y2"), z2: n("run-z2"), width: n("run-w"), height: n("run-h") };
  if ($("run-level").value.trim() !== "") a.level = Number($("run-level").value);
  const r = await call("add_run", a); renderRuns(r.runs); renderClashes(r.clashes);
  toast(r.new_clashes.length ? t("clash_new").replace("{n}", r.new_clashes.length) : t("i_done"));
});
// ---------------------------------------------------------------- open a saved project
function applySettings(s) {
  const b = s.brief || {}, st = s.structure || {};
  $("title").value = b.title ?? s.title ?? "";
  for (const [id, k] of [["width", "width_m"], ["length", "length_m"], ["sbf", "setback_front_m"], ["sbb", "setback_back_m"], ["sbs", "setback_side_m"]]) $(id).value = b[k] ?? "";
  $("entry").value = b.entry || "south";
  if (Array.isArray(b.rooms)) { state.rooms = b.rooms.map(x => ({ key: x.key, name: x.name || "", func: x.func, area: x.area, zone: x.zone, light: !!x.light, floor: x.floor || 1 })); renderRooms(); }
  $("stairw").value = (b.stair || {}).width_m ?? ""; $("stairl").value = (b.stair || {}).length_m ?? ""; $("stairside").value = (b.stair || {}).side || "west";
  for (const [id, k] of [["dead", "dead_kpa"], ["live", "live_kpa"], ["bearing", "bearing_kpa"], ["floors", "floors"], ["maxspan", "max_span_mm"]]) $(id).value = st[k] ?? "";
  $("showstruct").checked = !!s.show_structure;
  $("mepin").value = s.mep && Object.keys(s.mep).length ? JSON.stringify(s.mep, null, 2) : "";
  $("showmep").checked = !!s.show_mep; state.mep = null; $("mepout").innerHTML = "";
  $("boqin").value = s.boq && Object.keys(s.boq).length ? JSON.stringify(s.boq, null, 2) : ""; state.boq = null; $("boqout").innerHTML = "";
  $("strin").value = s.sizing && Object.keys(s.sizing).length ? JSON.stringify(s.sizing, null, 2) : ""; state.str = null; $("strout").innerHTML = "";
}
$("openproj").onclick = () => busy(async () => {
  const st = await call("status");
  if (st.dirty && !confirm(t("discard_q"))) return;
  const r = await call("open_project");
  if (!r.opened) return;
  applySettings(r.settings || {});
  state.alts = []; state.sel = -1; state.qto = null; state.sched = null;
  $("alts").innerHTML = `<div class="empty">${t("alts_empty")}</div>`;
  showPlan(r.svg); state.notes = r.warnings; state.rooms_out = r.rooms; applyProject(r.settings || {}); renderSbc(r.sbc); refreshBim();
  renderNotes(); setPlanButtons(true); refreshStatus(); loadQto(); toast(t("opened") + ": " + r.opened);
});

applyLang();
call("assumptions").then(a => { state.assumptions = a; if (state.rooms_out) renderNotes(); });
</script>
