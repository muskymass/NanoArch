<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoArch</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c1f24;--mute:#5d6572;--line:#dfe2e7;--accent:#1f5fae;--accent-ink:#fff;--warn:#a65b00;--bad:#b3261e;--ok:#1b7a43;--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171b;--panel:#1d2127;--ink:#e8eaee;--mute:#9aa3b0;--line:#2e343c;--accent:#5b9cf0;--accent-ink:#0b1320;--warn:#e0a24a;--bad:#f2837c;--ok:#5fcf8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:700}
header .sub{color:var(--mute);font-size:12px}
@media (max-width:1500px){header .sub{display:none}}
header .grow{flex:1}
main{flex:1;display:grid;grid-template-columns:400px 1fr 420px;gap:12px;padding:12px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.scroll{overflow:auto;padding:12px;flex:1}
h2{font-size:13px;margin:14px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input[type=checkbox]{width:auto}
textarea{min-height:110px;font-family:Consolas,monospace;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--mute);margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td input,td select{padding:3px 5px;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.alts{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);min-height:112px}
.alt{flex:0 0 auto;width:130px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:2px;position:relative}
.alt.sel{border-color:var(--accent)}
.alt svg{width:100%;height:auto;display:block;max-height:118px}
.alt .tag{position:absolute;top:2px;inset-inline-start:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 4px}
#v3{flex:1;display:none;flex-direction:column;min-height:0;background:#f3f5f8}
#v3 .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid #ddd}
#v3 .tools label{display:flex;gap:4px;align-items:center;margin:0}
#gl{flex:1;width:100%;min-height:0;display:block;cursor:grab;touch-action:none}
#dr-props{height:64px;overflow:auto;align-content:flex-start;box-sizing:border-box}
#viewer.draft{padding:0;align-items:stretch;justify-content:stretch;overflow:hidden}
#viewer.draft svg{max-width:none;flex:1 1 100%;width:100%;height:100%;cursor:crosshair}
#viewer.draft svg [data-id]{cursor:crosshair}
/* invisible hit lines over thin plan elements: their width is in SCREEN pixels, whatever the zoom */
#viewer svg .gridhit,#viewer svg .dimhit,#viewer svg .sephit{stroke:transparent;stroke-width:12px;vector-effect:non-scaling-stroke;pointer-events:stroke}
#viewer svg .sepline{stroke:#7a5ca8;stroke-width:1.4;stroke-dasharray:7 4;fill:none}
#viewer svg .separator.sel .sepline,#viewer svg .sel .sepline{stroke:var(--accent);stroke-width:2.4}
/* The menu bar: ONE row of eight drop-downs. Panels are position:fixed (placed from the trigger's rectangle), so nothing clips them. */
header{position:relative;z-index:20}
#menubar{display:flex;align-items:center;gap:2px;min-width:0;flex:0 1 auto}
.mm{display:block}
.mt{padding:5px 9px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:13px;white-space:nowrap;line-height:1.3}
.mt::after{content:"";display:inline-block;vertical-align:middle;margin-inline-start:5px;border:4px solid transparent;border-top-color:var(--mute);border-bottom-width:0}
.mt:hover,.mt[aria-expanded=true]{background:var(--bg);border-color:var(--line)}
.mt:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mp{position:fixed;z-index:30;min-width:240px;max-width:calc(100vw - 16px);max-height:calc(100vh - 52px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:5px}
.mp[hidden]{display:none}
.mi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;text-align:start;border:0;background:transparent;padding:6px 10px;border-radius:5px;white-space:nowrap;font-size:13px}
.mi:hover:not(:disabled){background:var(--bg)}
.mi.primary,.mi.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink);font-weight:600}
.mi[data-kbd]:not([data-kbd=""])::after{content:attr(data-kbd);color:var(--mute);font-size:11px;font-family:Consolas,monospace;direction:ltr;font-weight:400}
.mi .mic{display:inline-block;width:20px;text-align:center;margin-inline-end:6px}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mh{font-size:11px;color:var(--mute);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.mrow{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:3px 10px}
.mp label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink);font-size:13px}
.mck{padding:4px 10px}
.mp select,.mp input[type=number]{padding:3px 5px;font-size:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 10px;min-width:min(720px,calc(100vw - 32px))}
.mcol.wide{grid-column:1/-1;border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
#v3tools{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:4px 10px}
#levelbar{border:0;padding:4px 10px!important;flex-wrap:wrap}
#levelbar::before{content:attr(data-label);font-size:12px;color:var(--mute)}
#levelbar button{padding:2px 8px}
#dr-opts{position:absolute;inset-inline-start:10px;top:8px;z-index:3;display:none;gap:8px;align-items:center;flex-wrap:wrap;max-width:80%;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}
#dr-opts input[type=number]{width:54px;padding:2px 5px}
#dr-opts label{display:flex;gap:3px;align-items:center;margin:0;color:var(--ink)}
#dr-hint{position:absolute;inset-inline-start:10px;bottom:8px;max-width:70%;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;pointer-events:none;z-index:3;display:none}
#asm-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center}
#asm-box{background:#fff;color:var(--ink);width:min(980px,96vw);max-height:92vh;overflow:auto;border-radius:10px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#asm-box table{width:100%;border-collapse:collapse}#asm-box td,#asm-box th{padding:3px 5px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:start}
#asm-box .card{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
#asm-box input,#asm-box select{width:auto}
#vp{flex:1;display:flex;flex-direction:row;min-height:0;min-width:0;position:relative}
#vp>#viewer,#vp>#v3{min-width:0}
#vp.split>#v3 .tools{max-height:72px;overflow-y:auto;gap:6px}
#vp.split>#v3 #gl{min-height:240px}
#vp.split>#viewer{flex:1 1 50%}#vp.split>#v3{flex:1 1 50%;border-inline-start:2px solid var(--line)}
#viewer svg .osel{stroke:#e6a100!important;stroke-width:4!important;filter:drop-shadow(0 0 3px #e6a100)}
#viewer svg g.osel .leaf,#viewer svg g.osel .glass{stroke:#e6a100!important;stroke-width:3!important}
.osel-row{background:rgba(230,161,0,.22)!important;outline:1px solid #e6a100}
.olr{display:flex;align-items:center;gap:6px;padding-block:3px;padding-inline-end:6px;border-radius:5px;cursor:pointer;white-space:nowrap}
.olr:hover{background:var(--bg)}.olr.on{background:rgba(230,161,0,.25);outline:1px solid #e6a100}
.ola{width:14px;text-align:center;color:var(--mute);user-select:none}
.olk{width:8px;height:8px;border-radius:2px;background:var(--mute);flex:0 0 auto}
.olk-Site{background:#1f5fae}.olk-Level{background:#6a4bb8}.olk-Spaces,.olk-Space{background:#2e9b6b}.olk-Structural,.olk-Column,.olk-Beam,.olk-Slab,.olk-Footing,.olk-TieBeam{background:#b6501a}.olk-MEP,.olk-MepRun,.olk-MepPoint{background:#16a0a6}.olk-Execution,.olk-Schedule,.olk-Phase,.olk-Task{background:#c7a100}
.oll{overflow:hidden;text-overflow:ellipsis}.olc{font-size:10px;color:var(--mute);background:var(--bg);border-radius:8px;padding:0 6px}
.olg{padding:0 6px;margin-inline-start:auto;border:0;background:transparent;color:var(--accent)}
#viewer{flex:1;overflow:auto;padding:8px;background:#fff;display:flex;justify-content:center;align-items:flex-start}
#viewer svg{width:100%;max-width:820px;height:auto;flex:0 0 auto}
#viewer svg .wall.int,#viewer svg .door,#viewer svg .window,#viewer svg .room{cursor:pointer}
#viewer svg .sel{stroke:#e6a100!important;stroke-width:4!important}
#viewer svg g.sel .leaf,#viewer svg g.sel .glass{stroke:#e6a100!important;stroke-width:3!important}
#inspector input{width:90px}
#inspector .hint{color:var(--mute);font-size:12px}
.rooms{table-layout:fixed}
.rooms th,.rooms td{padding:3px 2px}
.rooms th:nth-child(1){width:27%}.rooms th:nth-child(2){width:19%}.rooms th:nth-child(3){width:15%}.rooms th:nth-child(4){width:19%}.rooms th:nth-child(5){width:8%}.rooms th:nth-child(6){width:12%}
.rooms select{padding:3px 1px;font-size:11px}
.rooms input[type=number]{width:100%!important}
.rooms button{padding:2px 6px}
.empty{color:var(--mute);padding:32px;text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:9px 6px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none}.pane.on{display:block}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
ul.clean{margin:0;padding-inline-start:18px}
ul.clean li{margin:3px 0}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)}
.sugg{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.missing{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:8px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--mute)}
#busy{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;z-index:9}
#busy.on{display:flex}
#toast{position:fixed;bottom:16px;inset-inline-start:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:10;max-width:60vw}
#toast.on{opacity:1}
main>.col{min-width:0}
/* The side panels can be put away so the plan has the room: main.hl hides the brief column, main.hr the results column. */
main.hl>.col:first-child,main.hr>.col:last-child{display:none}
main.hl{grid-template-columns:1fr 420px}main.hr{grid-template-columns:400px 1fr}main.hl.hr{grid-template-columns:1fr}
@media (max-width:1200px){main{grid-template-columns:340px 1fr 340px}main.hl{grid-template-columns:1fr 340px}main.hr{grid-template-columns:340px 1fr}main.hl.hr{grid-template-columns:1fr}}
/* Narrow window (900 px and the like): thinner panels and tighter gaps; the menu bar stays one row, so the canvas keeps its size. */
@media (max-width:1100px){
  main{grid-template-columns:250px 1fr 280px;gap:8px;padding:8px}main.hl{grid-template-columns:1fr 280px}main.hr{grid-template-columns:250px 1fr}main.hl.hr{grid-template-columns:1fr}
  header{padding:4px 8px;gap:6px}header .sub{display:none}.mt{padding:5px 5px;font-size:12.5px}.mt::after{display:none}header h1{font-size:15px}header .badge{font-size:10px;line-height:1.15;max-width:84px;white-space:normal;padding:0 6px;text-align:center}
  main>.col:nth-child(2){overflow-y:auto}
  #vp{min-height:300px}
  /* While drafting, the alternatives strip is not needed: the plan is chosen. */
  main>.col:nth-child(2):has(#viewer.draft)>.alts{display:none}
}
</style>
</head>
<body>
<header>
  <h1>NanoArch</h1>
  <nav id="menubar" aria-label="NanoArch">
    <div class="mm"><button type="button" class="mt" id="mt-file" data-menu="file" aria-haspopup="true" aria-expanded="false" aria-controls="mp-file"></button>
      <div class="mp" id="mp-file" hidden>
        <button class="mi" id="openproj" data-i="open_proj"></button>
        <button class="mi" id="newblank"></button>
        <button class="mi" id="saveproj" disabled data-i="save_proj"></button>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-draw" data-menu="draw" aria-haspopup="true" aria-expanded="false" aria-controls="mp-draw"></button>
      <div class="mp" id="mp-draw" hidden>
        <button class="mi" id="draft" disabled></button>
        <div class="msep"></div>
        <div id="mm-draw"></div>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-mod" data-menu="mod" aria-haspopup="true" aria-expanded="false" aria-controls="mp-mod"></button>
      <div class="mp" id="mp-mod" hidden>
        <button class="mi" id="undo" disabled data-i="undo"></button>
        <button class="mi" id="redo" disabled data-i="redo"></button>
        <div class="msep"></div>
        <div id="mm-mod"></div>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-gen" data-menu="gen" aria-haspopup="true" aria-expanded="false" aria-controls="mp-gen"></button>
      <div class="mp" id="mp-gen" hidden>
        <button type="button" class="mi" data-click="generate" data-kbd=""></button>
        <button class="mi" id="sync" disabled data-i="sync"></button>
        <div class="msep"></div>
        <div id="mm-bim"></div>
        <div class="msep"></div>
        <button type="button" class="mi" data-open-tab="bim"></button>
        <button type="button" class="mi" data-open-tab="ol"></button>
        <button type="button" class="mi" data-open-tab="vr"></button>
        <button type="button" class="mi" data-open-tab="sketch"></button>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-sbc" data-menu="sbc" aria-haspopup="true" aria-expanded="false" aria-controls="mp-sbc"></button>
      <div class="mp" id="mp-sbc" hidden>
        <button type="button" class="mi" data-open-tab="rules"></button>
        <button type="button" class="mi" data-open-tab="sbc"></button>
        <button type="button" class="mi" data-open-tab="cp"></button>
        <button type="button" class="mi" data-open-tab="ov"></button>
        <button type="button" class="mi" data-open-tab="an"></button>
        <button type="button" class="mi" data-open-tab="str"></button>
        <button type="button" class="mi" data-open-tab="notes"></button>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-mep" data-menu="mep" aria-haspopup="true" aria-expanded="false" aria-controls="mp-mep"></button>
      <div class="mp" id="mp-mep" hidden>
        <button type="button" class="mi" data-open-tab="mep"></button>
        <button type="button" class="mi" data-open-tab="mx"></button>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-cost" data-menu="cost" aria-haspopup="true" aria-expanded="false" aria-controls="mp-cost"></button>
      <div class="mp" id="mp-cost" hidden>
        <button type="button" class="mi" data-open-tab="qto"></button>
        <button type="button" class="mi" data-open-tab="sched"></button>
        <button type="button" class="mi" data-open-tab="boq"></button>
        <button type="button" class="mi" data-open-tab="ex"></button>
        <div class="msep"></div>
        <div class="mh" id="mh-4d"></div>
        <div class="mrow" id="mm-4d">
          <label><input type="checkbox" id="v-4d"><span data-i="v_4d"></span></label>
          <button id="v-play" data-i="v_play"></button><input type="range" id="v-day" min="0" max="0" value="0" style="width:170px">
          <span id="v-day-info" class="note"></span>
        </div>
      </div></div>
    <div class="mm"><button type="button" class="mt" id="mt-view" data-menu="view" aria-haspopup="true" aria-expanded="false" aria-controls="mp-view"></button>
      <div class="mp" id="mp-view" hidden>
        <div class="mgrid">
        <div class="mcol">
          <div class="mh" data-mh="view"></div>
          <button class="mi" id="to3d" disabled></button>
          <button class="mi" id="split" disabled></button>
          <div class="mrow"><select id="viewsel" disabled style="width:auto"><option value="plan" data-i="v_plan"></option><option value="north" data-i="v_north"></option><option value="south" data-i="v_south"></option><option value="east" data-i="v_east"></option><option value="west" data-i="v_west"></option><option value="A-A" data-i="v_aa"></option><option value="B-B" data-i="v_bb"></option><option value="site" data-i="v_site"></option><option value="furn" data-i="v_furn"></option></select><input id="sec-at" type="number" step="0.1" style="width:90px" data-title="sec_at" placeholder="m"></div>
          <label class="mck"><input type="checkbox" id="showstruct"><span data-i="show_struct"></span></label>
          <button id="pan-l" class="mi pan" data-i="pan_brief"></button>
          <button id="pan-r" class="mi pan" data-i="pan_results"></button>
          <div id="mm-view"></div>
          <div id="levelbar" class="bar" style="display:none;gap:6px;padding:6px 8px"></div>
          <button type="button" class="mi" data-open-tab="pr"></button>
          <button class="mi" id="lang">English</button>
        </div>
        <div class="mcol">
          <div class="mh" data-mh="exp"></div>
          <button class="mi" id="exportsvg" disabled data-i="export_svg"></button>
          <button class="mi" id="exportifc" disabled data-i="export_ifc"></button>
          <button class="mi" id="exportdxf" disabled data-i="export_dxf"></button>
          <button class="mi" id="exportdxfall" disabled style="display:none" data-i="export_dxf_all"></button>
          <button class="mi" id="exportrep" disabled data-i="rep_pdf"></button>
          <button class="mi" id="exportrepx" disabled data-i="rep_xlsx"></button>
          <button class="mi" id="exportpdf" disabled data-i="export_pdf"></button>
          <label class="mck"><input type="checkbox" id="dxfviews"><span data-i="dxf_views"></span></label>
        </div>
        <div class="mcol wide">
          <div class="mh" data-mh="3d"></div>
          <div id="v3tools">
            <label><input type="checkbox" id="v-slab"><span data-i="v_slab"></span></label>
            <label><input type="checkbox" id="v-struct"><span data-i="v_struct"></span></label>
            <label><input type="checkbox" id="v-floor"><span data-i="v_floor"></span></label>
            <label><input type="checkbox" id="v-glass"><span data-i="v_glass"></span></label>
            <label><input type="checkbox" id="v-mep"><span data-i="v_mep"></span></label>
            <label><input type="checkbox" id="v-d-architectural"><span data-i="d_architectural"></span></label><label><input type="checkbox" id="v-d-structural"><span data-i="d_structural"></span></label><label><input type="checkbox" id="v-d-electrical"><span data-i="d_electrical"></span></label><label><input type="checkbox" id="v-d-plumbing"><span data-i="d_plumbing"></span></label><label><input type="checkbox" id="v-d-hvac"><span data-i="d_hvac"></span></label>
            <label id="v-level-wrap" style="display:none"><span data-i="v_level"></span> <select id="v-level"></select></label>
            <button id="v-top" data-i="v_top"></button><button id="v-reset" data-i="v_reset"></button>
            <button id="v-walk"></button><label><span id="v-eye-l"></span> <input id="v-eye" type="number" step="0.05" min="0.5" max="2.5" value="1.70" style="width:62px"></label>

  if (!SK.base || !SK.ppm || !plot || $("sk-swap").checked) return null;
  const mm = v => v / SK.ppm * 1000, left = Math.min(plot.a.x, plot.b.x), bottom = Math.max(plot.a.y, plot.b.y);
  const sx = (num("sbs") || 0) * 1000, sy = (num("sbf") || 0) * 1000, out = {};
  for (const m of SK.marks) {
    if (m.kind !== "room" || !state.rooms.some(r => r.key === m.key)) continue;
    out[m.key] = { x: mm(Math.min(m.a.x, m.b.x) - left) - sx, y: mm(bottom - Math.max(m.a.y, m.b.y)) - sy, w: mm(Math.abs(m.a.x - m.b.x)), h: mm(Math.abs(m.a.y - m.b.y)) };
  }
  return Object.keys(out).length ? out : null;
}

  SK.pts.push(p);
  if (SK.pts.length < 2) { skDraw(); skMsg(SK.tool === "scale" ? "sk_pick_scale" : "sk_pick_p2"); return; }
  const [a, b] = SK.pts, dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y); SK.pts = [];
  if (SK.tool === "scale") {
    const d = Math.hypot(dx, dy); if (d < 2) { skDraw(); return; }
    SK.ppm = d / num("sk-known"); SK.marks = SK.marks.filter(m => m.kind !== "scale"); SK.marks.push({ kind: "scale", a, b, color: "#e91e63" }); SK.tool = null; skDraw(); skMsg("sk_scale_set", { px: SK.ppm.toFixed(1) });
  } else if (SK.tool === "plot") {
    let w = dx / SK.ppm, l = dy / SK.ppm; if ($("sk-swap").checked) [w, l] = [l, w];
    $("width").value = w.toFixed(2); $("length").value = l.toFixed(2);

  } else {

// Doors, windows and partitions are only a few pixels thick on screen, so a pointer near them counts as on them.
function nearRect(e, rect, pad) { const b = rect.getBoundingClientRect(); return e.clientX >= b.left - pad && e.clientX <= b.right + pad && e.clientY >= b.top - pad && e.clientY <= b.bottom + pad; }
function pickOpening(e) { return [...document.querySelectorAll("#viewer g.door, #viewer g.window")].find(g => { const c = g.querySelector("rect.cut"); return c && nearRect(e, c, 8); }); }
function pickPartition(e) {
  const direct = e.target.closest("rect.wall.int[data-id]"); if (direct) return direct;
  return [...document.querySelectorAll("#viewer rect.wall.int[data-id]")].find(r => nearRect(e, r, 5));
}
const drag = { el: null, x: 0, y: 0, moved: false, horizontal: false };
$("viewer").addEventListener("mousedown", e => {
  const el = pickOpening(e) ? null : pickPartition(e);
  if (!el || e.button !== 0) return;
  e.preventDefault();
  const b = el.getBoundingClientRect();
  Object.assign(drag, { el, x: e.clientX, y: e.clientY, moved: false, horizontal: b.width > b.height });
});
document.addEventListener("mousemove", e => {
  if (!drag.el) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  const svg = drag.el.ownerSVGElement, k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  drag.el.style.transform = drag.horizontal ? `translate(0px, ${dy / k}px)` : `translate(${dx / k}px, 0px)`;
});
document.addEventListener("mouseup", e => {
  if (!drag.el) return;
  const el = drag.el; drag.el = null;
  if (!drag.moved) return; // a plain click is handled below
  const svg = el.ownerSVGElement, k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  // Screen up is model +y; screen right is model +x. Snap to 50 mm.
  const raw = drag.horizontal ? -(e.clientY - drag.y) / k / PX_PER_MM : (e.clientX - drag.x) / k / PX_PER_MM;
  const delta = Math.round(raw / 50) * 50;
  el.style.transform = "";
  if (delta === 0) return;
  busy(async () => afterEdit(await call("move_partition", { wall: el.dataset.id, delta_mm: delta })));
});

const exN = (v, what) => { v = String(v ?? "").trim(); if (v === "") return null; const n = Number(v); if (!Number.isFinite(n)) throw new Error((what ? what + ": " : "") + L("قيمة غير رقمية: ", "not a number: ") + v); return n; };

    <div class="bar" style="padding:0 0 6px;border:0"><input id="ol-f" placeholder="${L("بحث…", "Search…")}" value="${esc(OL.filter)}" style="max-width:200px"><button id="ol-all">${L("وسّع الكل", "Expand all")}</button><button id="ol-none">${L("اطوِ الكل", "Collapse all")}</button><button id="ol-clear">${L("ألغِ التحديد", "Clear selection")}</button></div>

    }
  });
  bar.addEventListener("focusout", e => { if (MB.open && e.relatedTarget && !bar.contains(e.relatedTarget)) mbClose(false); });
  document.addEventListener("pointerdown", e => { if (MB.open && !e.target.closest("#menubar")) mbClose(false); }, true);
  // Escape closes the open menu first and never reaches the drafting keys; any other shortcut key closes it and then works as usual.
  document.addEventListener("keydown", e => {
    if (!MB.open) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); mbClose(true); }
    else if (((e.key.length === 1 && e.key !== " ") || e.ctrlKey || e.metaKey) && !drTyping(e)) mbClose(false);
  }, true);
  window.addEventListener("resize", () => mbClose(false)); window.addEventListener("blur", () => mbClose(false));
})();
// Ctrl+Z / Ctrl+Y: the shortcuts the Modify menu shows. While drafting, drKey already does it.
window.addEventListener("keydown", e => {
  if (DR.on || !(e.ctrlKey || e.metaKey) || e.altKey || drTyping(e)) return;
  const k = e.key.toLowerCase(); if (k !== "z" && k !== "y") return;
  const b = $(k === "z" && !e.shiftKey ? "undo" : "redo"); if (b.disabled) return; e.preventDefault(); b.click();
});

applyLang();
call("assumptions").then(a => { state.assumptions = a; if (state.rooms_out) renderNotes(); });
</script>
