/* resizers: pointer + keyboard, direction aware */
function rzWidth(rz,x){var tg=document.querySelector(rz.dataset.rzTarget);var r=tg.getBoundingClientRect();var rtl=document.documentElement.dir==='rtl';
 var w=rz.dataset.rzSide==='start'?(rtl?r.right-x:x-r.left):(rtl?x-r.left:r.right-x);
 return Math.max(+rz.dataset.min,Math.min(+rz.dataset.max,Math.round(w)));}

 var mv=function(ev){setSize(rz.dataset.rz,rzWidth(rz,ev.clientX));};
 var up=function(){rz.classList.remove('drag');rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up);save();};
 rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up);});
document.addEventListener('keydown',function(e){var rz=e.target.closest&&e.target.closest('.rz');if(!rz)return;if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();
 var rtl=document.documentElement.dir==='rtl';var dx=e.key==='ArrowRight'?16:-16;var cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(rz.dataset.rz))||+rz.dataset.min;
 var d=rz.dataset.rzSide==='start'?(rtl?-dx:dx):(rtl?dx:-dx);setSize(rz.dataset.rz,Math.max(+rz.dataset.min,Math.min(+rz.dataset.max,cur+d)));save();});
