.sb{border:0;background:transparent;color:var(--on-accent);min-height:24px;padding:0 6px;border-radius:var(--r-sm);font-size:.75rem}
.sb:hover{background:color-mix(in srgb,var(--on-accent) 18%,transparent)}
.sb:focus-visible{outline-color:var(--on-accent);outline-offset:-2px}
/* command palette */
.cmd-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmd{width:min(580px,94vw);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);overflow:hidden}
.cmd input{width:100%;min-height:44px;padding:0 14px;border:0;border-bottom:1px solid var(--border);background:var(--surface);font-size:1rem}
.cmd input:focus-visible{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.cmd ul{list-style:none;margin:0;padding:4px;max-height:52vh;overflow:auto}
.cmd li{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:var(--r);cursor:pointer}
.cmd li[aria-selected=true]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
[dir=rtl] .cmd li[aria-selected=true]{box-shadow:inset -3px 0 0 var(--accent)}
.cmd li .g{margin-inline-start:auto;color:var(--text-muted);font-size:.75rem}
.pop{inset-block-start:calc(100% + 6px);inset-inline-end:0;width:330px}
.pop-wrap{position:relative}
@media (max-width:1100px){.hide-md{display:none!important}.cmdbtn{width:min(300px,30vw)}}
@media (max-width:900px){
 .view.plan.on{display:flex;flex-direction:column;gap:10px;height:auto}
 body[data-page=plan] #content{overflow:auto}
 .rz{display:none}
 .pl-center .cv{min-height:320px}
}
@media (max-width:700px){
 .body{grid-template-columns:44px minmax(0,1fr)}
 .tree,.scrim{display:none!important}
 body.no-tree .body{grid-template-columns:44px minmax(0,1fr)}
 .act{width:44px}
 .hide-sm,.proj,.cmd-t,.cmdbtn kbd{display:none!important}
 .cmdbtn{width:auto;min-width:34px;padding:0 8px}
 .title{gap:4px}
 .dock{height:150px}
 #content{padding:10px}
 .fgrid,.fgrid.three{grid-template-columns:minmax(0,1fr)}
 .cv-tools .tl{display:none}
}

var NA=window.NA,S=NA.S,t=NA.t,ic=NA.ic;
S.docs=S.docs&&S.docs.length?S.docs:['sketch'];S.dock=S.dock||'problems';
function groupOf(tab){return NA.NAV.filter(function(g){return g.tabs.some(function(x){return x[0]===tab;});})[0];}
function build(){
 var g=groupOf(S.tab),h='';
 NA.NAV.forEach(function(x){h+='<button type="button" class="ab'+(x.id===g.id?' on':'')+'" data-grp="'+x.id+'" data-go="'+x.tabs[0][0]+'" title="'+t('g_'+x.id)+'" aria-label="'+t('g_'+x.id)+'">'+ic(x.ic)+'</button>';});
 document.getElementById('act').innerHTML=h;
 var l='';g.tabs.forEach(function(tb,i){l+='<button type="button" class="tr'+(tb[0]===S.tab?' on':'')+'" data-go="'+tb[0]+'" data-nav '+(tb[0]===S.tab?'aria-current="page"':'')+'>'+ic(tb[1])+'<span>'+t('t_'+tb[0])+'</span><span class="tk">'+(i+1)+'</span></button>';});
 document.getElementById('treelist').innerHTML=l;
 var d='';S.docs.forEach(function(id){var on=id===S.tab;var ico=groupOf(id).tabs.filter(function(x){return x[0]===id;})[0][1];
  d+='<span class="dcw"><button type="button" class="dc'+(on?' on':'')+'" role="tab" aria-selected="'+on+'" data-go="'+id+'" data-nav>'+ic(ico)+'<span>'+t('t_'+id)+'</span></button>'+(S.docs.length>1?'<button type="button" class="dx" data-close="'+id+'" aria-label="'+t('close')+' '+t('t_'+id)+'" title="'+t('close')+'">'+ic('x')+'</button>':'')+'</span>';});
 document.getElementById('docs').innerHTML=d;
 dock();
 document.getElementById('st-theme').textContent=t('th_'+S.theme);
 document.getElementById('st-lang').textContent=S.lang==='ar'?'العربية':'English';
 var el=document.getElementById('st-sel');if(el)el.textContent='';
}
function dock(){
 var R=NA.RULES,bad=R.filter(function(r){return r[1]!=='pass';});
 var tabs=[['problems',t('dock_problems'),bad.length],['boq',t('dock_boq'),null],['log',t('dock_log'),null]];
 document.getElementById('dtabs').innerHTML=tabs.map(function(x){return '<button type="button" class="dt" role="tab" data-dt="'+x[0]+'" aria-selected="'+(S.dock===x[0])+'">'+x[1]+(x[2]!=null?' <span class="cnt">'+x[2]+'</span>':'')+'</button>';}).join('');
 var b='';
 if(S.dock==='problems'){bad.forEach(function(r){b+='<button type="button" class="dp" data-go="cp"><svg class="ic '+r[1]+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+r[1]+'"/></svg><span>'+t('ru_'+r[0])+'</span><span class="badge '+r[1]+'">'+t('cp_'+r[1])+'</span><span class="src">'+(r[1]==='skip'?t('cp_skip_why'):'SBC 201')+'</span></button>';});}
 else if(S.dock==='boq'){b='<div class="dline">'+t('bq_unpriced')+': 4 / 8</div><button type="button" class="dp" data-go="boq">'+ic('table')+'<span>'+t('t_boq')+'</span></button>';}
 else{b='<div class="dline">'+t('st_ready')+' · '+t('st_offline')+'</div>';}
 document.getElementById('dbody').innerHTML=b;
}
/* documents */
function touchDoc(tab){if(S.docs.indexOf(tab)<0){S.docs.push(tab);if(S.docs.length>6)S.docs.shift();}}
NA.hooks.render=build;
NA.hooks.go=function(tab,v){document.body.dataset.page=v;touchDoc(tab);NA.keepFocus(build);NA.save();};
document.addEventListener('click',function(e){
 var c=e.target.closest('[data-close]');
 if(c){var id=c.dataset.close,i=S.docs.indexOf(id);S.docs.splice(i,1);if(S.tab===id){NA.go(S.docs[Math.max(0,i-1)]);}else{NA.keepFocus(build);NA.save();}return;}
 var d=e.target.closest('[data-dt]');if(d){S.dock=d.dataset.dt;NA.keepFocus(dock);NA.save();return;}
 var cy=e.target.closest('[data-set-cycle]');
 if(cy){var k=cy.dataset.setCycle,opts=k==='theme'?['light','dark','hc','system']:['ar','en'];var nx=opts[(opts.indexOf(S[k])+1)%opts.length];
  var btn=document.querySelector('[data-set="'+k+'"][data-val="'+nx+'"]');if(btn){btn.click();}return;}
});
/* resizer for plan inputs */
var oldRender=NA.hooks.render;
NA.hooks.render=function(){oldRender();var p=document.querySelector('.view.plan');if(!p||!p.querySelector('.pl-inputs'))return;
 var a=document.createElement('div');a.className='rz r1';a.setAttribute('role','separator');a.tabIndex=0;a.setAttribute('aria-orientation','vertical');a.setAttribute('aria-label',t('resize'));
 a.dataset.rz='--w-inp';a.dataset.rzTarget='.pl-inputs';a.dataset.rzSide='start';a.dataset.min='220';a.dataset.max='460';p.querySelector('.pl-inputs').after(a);};
/* command palette */
var ov=document.getElementById('cmd'),inp=document.getElementById('cmd-in'),list=document.getElementById('cmd-list'),sel=0,items=[];
function all(){var a=[];NA.NAV.forEach(function(g){g.tabs.forEach(function(x){a.push({k:'go',id:x[0],l:t('t_'+x[0]),g:t('g_'+g.id),i:x[1]});});});
 a.push({k:'theme',l:t('cmd_theme'),g:'',i:'palette'});a.push({k:'lang',l:t('cmd_lang'),g:'',i:'palette'});return a;}
function paint(){var q=inp.value.trim().toLowerCase();items=all().filter(function(x){return !q||(x.l+' '+x.g).toLowerCase().indexOf(q)>=0;});if(sel>=items.length)sel=0;
 list.innerHTML=items.length?items.map(function(x,i){return '<li role="option" id="co-'+i+'" data-ci="'+i+'" aria-selected="'+(i===sel)+'">'+ic(x.i)+'<span>'+x.l+'</span><span class="g">'+x.g+'</span></li>';}).join(''):'<li role="option" aria-selected="false">'+t('cmd_none')+'</li>';
 inp.setAttribute('aria-activedescendant',items.length?'co-'+sel:'');}
var lastFocus=null;
function open(){lastFocus=document.activeElement;ov.hidden=false;inp.value='';sel=0;paint();inp.focus();}
function close(){ov.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function run(i){var x=items[i];if(!x)return;close();if(x.k==='go')NA.go(x.id);else{var k=x.k,opts=k==='theme'?['light','dark','hc','system']:['ar','en'];var nx=opts[(opts.indexOf(S[k])+1)%opts.length];var b=document.querySelector('[data-set="'+k+'"][data-val="'+nx+'"]');if(b)b.click();}}
document.getElementById('cmd-open').addEventListener('click',open);
inp.addEventListener('input',function(){sel=0;paint();});
ov.addEventListener('click',function(e){if(e.target===ov)close();var li=e.target.closest('[data-ci]');if(li)run(+li.dataset.ci);});
document.addEventListener('keydown',function(e){
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(ov.hidden)open();else close();return;}
 if(ov.hidden)return;
 if(e.key==='Escape'){e.preventDefault();close();}
 else if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%Math.max(1,items.length);paint();}
 else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+items.length)%Math.max(1,items.length);paint();}
 else if(e.key==='Enter'){e.preventDefault();run(sel);}
 else if(e.key==='Tab'){e.preventDefault();inp.focus();}
});
NA.hooks.esc=function(){};
NA.boot();
})();

</script>
</body>
</html>
